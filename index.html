<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>forwardslashdot</title>
  <meta name="description" content="forwardslashdot — coming soon." />
  <style>
    :root {
      --bg-top: #f5f5f7;
      --bg-bottom: #e8e8ed;
      --ink: #1d1d1f;
      --ink-soft: #6e6e73;
      --mark: #1d1d1f;
      --glow: rgba(255, 255, 255, 0.7);
      --link: #0071e3;
      --hairline: rgba(29, 29, 31, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100%;
      font-family: "SF Pro Display", "SF Pro Text", -apple-system, BlinkMacSystemFont,
        "Helvetica Neue", Helvetica, Arial, sans-serif;
      color: var(--ink);
      background:
        radial-gradient(120% 80% at 50% -10%, var(--glow), transparent 55%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .stage {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2.5rem 1.5rem 3rem;
    }

    .hero {
      text-align: center;
      max-width: 28rem;
    }

    .mark {
      display: block;
      font-size: clamp(4.5rem, 18vw, 7.5rem);
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 0.9;
      color: var(--mark);
      opacity: 0;
      transform: translateY(12px);
      animation: rise 1.1s cubic-bezier(0.22, 1, 0.36, 1) 0.1s forwards;
    }

    .name {
      margin-top: 1.25rem;
      font-size: clamp(0.95rem, 2.4vw, 1.05rem);
      font-weight: 500;
      letter-spacing: 0.02em;
      color: var(--ink-soft);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.35s forwards;
    }

    .tag {
      margin-top: 2.75rem;
      font-size: clamp(1.35rem, 4vw, 1.75rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--ink);
      opacity: 0;
      transform: translateY(10px);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 0.55s forwards;
    }

    .rule {
      width: 2.5rem;
      height: 1px;
      margin: 1.35rem auto 0;
      background: rgba(29, 29, 31, 0.18);
      transform: scaleX(0);
      transform-origin: center;
      animation: draw 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
    }

    .utilities {
      max-width: 32rem;
      margin: 0 auto;
      padding: 0 1.5rem 5rem;
      opacity: 0;
      transform: translateY(14px);
      animation: rise 1s cubic-bezier(0.22, 1, 0.36, 1) 1s forwards;
    }

    .utilities-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 1.25rem;
    }

    .utility {
      padding-top: 1.35rem;
      border-top: 1px solid var(--hairline);
    }

    .utility h2 {
      font-size: 1.15rem;
      font-weight: 560;
      letter-spacing: -0.02em;
      margin-bottom: 0.45rem;
    }

    .utility h2 a {
      color: var(--ink);
    }

    .utility h2 a:hover {
      color: var(--link);
    }

    .utility p {
      font-size: 0.95rem;
      line-height: 1.45;
      color: var(--ink-soft);
      max-width: 28rem;
    }

    .utility .meta {
      margin-top: 0.85rem;
      font-size: 0.8rem;
      color: var(--ink-soft);
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes draw {
      to {
        transform: scaleX(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .mark, .name, .tag, .rule, .utilities {
        animation: none;
        opacity: 1;
        transform: none;
      }
    }
  </style>
</head>
<body>
  <main class="stage">
    <div class="hero">
      <span class="mark" aria-label="forwardslashdot">/.</span>
      <p class="name">forwardslashdot</p>
      <p class="tag">Coming soon</p>
      <div class="rule" aria-hidden="true"></div>
    </div>
  </main>

  <section class="utilities" aria-labelledby="utilities-heading">
    <p class="utilities-label" id="utilities-heading">Utilities</p>
    <article class="utility">
      <h2><a href="/utilities/domain.html">Domain availability</a></h2>
      <p>
        Check whether a domain is free to register — via REST or MCP at
        <a href="https://api.forwardslashdot.com/health">api.forwardslashdot.com</a>.
      </p>
      <p class="meta">
        Live API ·
        <a href="/utilities/domain.html">Endpoints &amp; curl</a>
      </p>
    </article>
  </section>
</body>
</html>
