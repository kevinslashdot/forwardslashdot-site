  <style>
    :root {
      --bg-top: #f5f5f7;
      --bg-mid: #ececf1;
      --bg-bottom: #e4e4ea;
      --ink: #1d1d1f;
      --ink-soft: #6e6e73;
      --mark: #1d1d1f;
      --link: #0071e3;
      --hairline: rgba(29, 29, 31, 0.12);
      --field: rgba(255, 255, 255, 0.72);
      --field-border: rgba(29, 29, 31, 0.14);
      --focus: rgba(0, 113, 227, 0.28);
      --ok: #1f7a3f;
      --ok-soft: rgba(31, 122, 63, 0.12);
      --taken: #c41e3a;
      --taken-soft: rgba(196, 30, 58, 0.1);
      --idle: var(--ink-soft);
      --glow: rgba(255, 255, 255, 0.55);
      --font: "Outfit", "SF Pro Display", "Helvetica Neue", Helvetica, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      font-family: var(--font);
      color: var(--ink);
      background:
        radial-gradient(90% 55% at 50% -8%, var(--glow), transparent 52%),
        radial-gradient(40% 30% at 85% 70%, rgba(0, 113, 227, 0.05), transparent 70%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
      background-attachment: fixed;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    a {
      color: var(--link);
      text-decoration: none;
    }

    a:hover {
      text-decoration: underline;
      text-underline-offset: 0.15em;
    }

    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.35rem 1.35rem 3rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .brand {
      width: min(36rem, 100%);
      color: var(--ink);
      text-decoration: none;
    }

    .brand:hover {
      color: var(--ink);
      text-decoration: none;
    }

    .mark {
      display: inline-block;
      font-size: 1.55rem;
      font-weight: 600;
      letter-spacing: -0.08em;
      line-height: 1;
    }

    .search {
      width: min(36rem, 100%);
      margin-top: 16vh;
    }

    .search.has-answers {
      margin-top: 2.5rem;
    }

    .compose {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: stretch;
      gap: 0;
      margin: 0;
      color: var(--ink);
      border: 1px solid var(--field-border);
      border-radius: 0.9rem;
      background: var(--field);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition:
        color 0.35s ease,
        border-color 0.25s ease,
        box-shadow 0.25s ease;
    }

    .compose:focus-within {
      border-color: rgba(0, 113, 227, 0.45);
      box-shadow: 0 0 0 4px var(--focus);
    }

    .compose.is-available {
      color: var(--ok);
      border-color: rgba(31, 122, 63, 0.4);
    }

    .compose.is-available:focus-within {
      border-color: rgba(31, 122, 63, 0.55);
      box-shadow: 0 0 0 4px rgba(31, 122, 63, 0.16);
    }

    .compose.is-taken {
      color: var(--taken);
      border-color: rgba(196, 30, 58, 0.35);
    }

    .compose.is-taken:focus-within {
      border-color: rgba(196, 30, 58, 0.5);
      box-shadow: 0 0 0 4px rgba(196, 30, 58, 0.12);
    }

    .name-host {
      width: 100%;
      min-width: 0;
      display: block;
      cursor: text;
    }


    .tld-suffix {
      display: flex;
      align-items: center;
      gap: 0.28rem;
      margin: 0;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: clamp(1.15rem, 3.5vw, 1.35rem);
      font-weight: 500;
      letter-spacing: -0.025em;
      color: var(--ink-soft);
      padding: 0 0.85rem 0 0.35rem;
      cursor: pointer;
      white-space: nowrap;
    }

    .tld-suffix .chevron {
      width: 0.72rem;
      height: 0.72rem;
      opacity: 0.55;
    }

    .tld-pop {
      position: relative;
      display: flex;
      align-items: stretch;
    }

    .tld-menu {
      position: absolute;
      top: calc(100% + 0.4rem);
      right: 0;
      z-index: 30;
      width: min(17rem, calc(100vw - 2rem));
      padding: 0.3rem;
      border-radius: 0.9rem;
      background: rgba(255, 255, 255, 0.84);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      box-shadow:
        0 18px 50px rgba(29, 29, 31, 0.16),
        0 0 0 0.5px rgba(29, 29, 31, 0.08);
    }

    .tld-menu[hidden] { display: none; }

    .tld-search {
      display: block;
      width: 100%;
      box-sizing: border-box;
      border: 0;
      border-bottom: 1px solid var(--hairline);
      background: transparent;
      font: inherit;
      font-size: 0.95rem;
      color: var(--ink);
      padding: 0.5rem 0.65rem 0.55rem;
      outline: none;
    }

    .tld-options {
      max-height: 16.5rem;
      overflow: auto;
      padding-top: 0.2rem;
    }

    .tld-group-label {
      font-size: 0.68rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--ink-soft);
      padding: 0.55rem 0.7rem 0.2rem;
    }

    .tld-option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 0.98rem;
      letter-spacing: -0.02em;
      color: var(--ink);
      text-align: left;
      padding: 0.42rem 0.7rem;
      border-radius: 0.5rem;
      cursor: pointer;
    }

    .tld-option.is-active,
    .tld-option:hover {
      background: rgba(29, 29, 31, 0.06);
    }

    .tld-mark {
      font-size: 0.85rem;
      opacity: 0;
    }

    .tld-option[aria-selected="true"] .tld-mark { opacity: 1; }

    .tld-empty {
      margin: 0;
      padding: 0.7rem;
      font-size: 0.9rem;
      color: var(--ink-soft);
    }

    .answers {
      list-style: none;
      margin-top: 0.85rem;
    }

    .answers[hidden] { display: none; }

    .answer {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto 5.75rem;
      align-items: center;
      gap: 0.75rem;
      padding: 0.68rem 0.15rem;
      border-top: 1px solid var(--hairline);
    }

    .answer.is-primary {
      border-top: 0;
      padding-top: 0.35rem;
      padding-bottom: 0.85rem;
    }

    .answer-name {
      appearance: none;
      border: 0;
      background: transparent;
      font: inherit;
      font-size: 1.02rem;
      font-weight: 500;
      letter-spacing: -0.03em;
      text-align: left;
      color: var(--ink-soft);
      padding: 0;
      cursor: pointer;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .answer.is-primary .answer-name {
      font-size: clamp(1.35rem, 4vw, 1.7rem);
      font-weight: 600;
    }

    .answer.is-available .answer-name { color: var(--ok); }
    .answer.is-taken .answer-name,
    .answer.is-invalid .answer-name { color: var(--taken); }

    .answer-name:hover { opacity: 0.72; }

    .answer-name:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px var(--focus);
      border-radius: 0.3rem;
    }

    .answer-status {
      font-size: 0.82rem;
      font-weight: 500;
      color: transparent;
      white-space: nowrap;
    }

    .answer.is-available .answer-status { color: var(--ok); }
    .answer.is-taken .answer-status,
    .answer.is-invalid .answer-status { color: var(--taken); }

    .answer-action {
      display: flex;
      justify-content: flex-end;
    }

    .register {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 1.9rem;
      padding: 0.28rem 0.8rem;
      border-radius: 980px;
      background: var(--ok);
      color: #fff;
      font-size: 0.82rem;
      font-weight: 560;
      letter-spacing: -0.01em;
      text-decoration: none;
    }

    .register:hover {
      color: #fff;
      text-decoration: none;
      filter: brightness(1.08);
    }

    .register:focus-visible {
      outline: none;
      box-shadow: 0 0 0 3px rgba(31, 122, 63, 0.28);
    }

    .disclosure {
      display: none;
      margin-top: 0.85rem;
      font-size: 0.72rem;
      line-height: 1.4;
      color: var(--ink-soft);
    }

    .disclosure.is-on { display: block; }

    .dev {
      width: min(34rem, 100%);
      margin: 0 auto;
      padding: 0 1.35rem 4.5rem;
      border-top: 1px solid var(--hairline);
      padding-top: 2.5rem;
    }

    .dev h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.55rem;
    }

    .dev p {
      font-size: 0.92rem;
      color: var(--ink-soft);
      line-height: 1.5;
      margin-bottom: 0.85rem;
    }

    .dev code {
      font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      font-size: 0.8rem;
      background: rgba(29, 29, 31, 0.05);
      padding: 0.08em 0.3em;
      border-radius: 0.3rem;
      color: var(--ink);
    }

    .dev a.api {
      font-size: 0.9rem;
    }

    @keyframes rise {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 420px) {
      .answer {
        grid-template-columns: minmax(0, 1fr) auto;
        grid-template-areas:
          "name status"
          "name action";
      }

      .answer-name { grid-area: name; }
      .answer-status { grid-area: status; }
      .answer-action { grid-area: action; }
    }

    @media (prefers-reduced-motion: reduce) {
      .compose,
      .tld-suffix {
        transition: none;
      }
    }
  </style>
</head>

  <main class="stage">
    <a class="brand" href="https://www.forwardslashdot.com/" aria-label="forwardslashdot"><span class="mark" aria-hidden="true">/.</span></a>

          </div>

        <p class="disclosure" id="disclosure"></p>

  </main>

        try {
          field.focus();
          var range = document.createRange();
          range.selectNodeContents(field);
          range.collapse(false);
          var sel = window.getSelection();
          sel.removeAllRanges();
          sel.addRange(range);
        } catch (_) {}
      }

      var nameInput = {
        get value() {
          return readField();
        },
        set value(v) {
          field.textContent = v || "";
          ghost.hidden = !!v;
        },
        focus: function () {
          placeCaretEnd();
        },
      };

      // Clicks inside the closed shadow retarget to the host. Canceling mousedown
      // left focus on that span, so the caret never entered the editor.
      host.addEventListener("focus", function () {
        if (shadow.activeElement !== field) field.focus();
      });
      shell.addEventListener("mousedown", function (e) {
        if (!field.contains(e.target)) field.focus();
      });

      var selectedTld = ".com";
      var endingChosen = false;
      var timer = null;
      var warmTimer = null;
      var abortController = null;
      var requestSeq = 0;
      var lastTypedAt = 0;
      var cache = new Map(); // domain -> { status, at, domain, affiliate_url, disclosure }
      var primaryNote = "";

      function sanitizeLabel(raw) {
        return String(raw || "")
          .toLowerCase()
          .replace(/[^a-z0-9-]/g, "")
          .replace(/^-+|-+$/g, "")
          .slice(0, 63);
      }

      function normalizeLabel(raw) {
        return sanitizeLabel(String(raw || "").split(".")[0]);
      }

      function normalizeEnding(raw) {
        var labels = String(raw || "")
          .trim()
          .toLowerCase()
          .replace(/^\.+/, "")
          .split(".")
          .map(function (part) {
            return part.replace(/[^a-z0-9-]/g, "").replace(/^-+|-+$/g, "").slice(0, 63);
          })
          .filter(Boolean);
        return labels.length ? "." + labels.join(".") : "";
      }

      function endingReady(ending) {
        var last = String(ending || "").split(".").pop();
        return /^[a-z]{2,63}$/.test(last);
      }

      function splitTyped(raw) {
        var text = String(raw || "")
          .trim()
          .toLowerCase()
          .replace(/^https?:\/\//, "")
          .replace(/\/.*$/, "")
          .replace(/\s+/g, "");
        var dot = text.indexOf(".");
        if (dot === -1) return { label: sanitizeLabel(text), ending: "" };
        return {
          label: sanitizeLabel(text.slice(0, dot)),
          ending: normalizeEnding(text.slice(dot))
        };
      }

      function readEnding() {
        return normalizeEnding(suffixLabel.textContent || "");
      }

      function writeEnding(ending) {
        var next = normalizeEnding(ending) || ".com";
        suffixLabel.textContent = next;
        if (endingReady(next)) selectedTld = next;
        return next;
      }

      function registerHref(domain, row) {
        if (row && row.affiliate_url) return row.affiliate_url;
        return "https://www.namecheap.com/domains/registration/results/?domain=" + encodeURIComponent(domain);
      }

      function answerEndings(label, primary) {
        var list = [primary];
        if (label.length < 3) return list;
        TLDS.forEach(function (tld) {
          if (list.indexOf(tld) === -1) list.push(tld);
        });
        return list;
      }

      function renderAnswers() {
        var label = normalizeLabel(readField());
        var ending = readEnding() || selectedTld;
        compose.classList.remove("is-available", "is-taken");
        if (!label || !endingReady(ending)) {
          answersEl.innerHTML = "";
          answersEl.hidden = true;
          searchEl.classList.remove("has-answers");
          disclosureEl.classList.remove("is-on");
          disclosureEl.textContent = "";
          return;
        }

        var endings = answerEndings(label, ending);
        var seen = {};
        var disclosure = "";
        Array.prototype.forEach.call(answersEl.children, function (li) {
          seen[li.dataset.domain] = li;
        });
        var frag = document.createDocumentFragment();
        endings.forEach(function (tld, index) {
          var domain = label + tld;
          var hit = cacheGet(domain);
          var li = seen[domain] || document.createElement("li");
          li.dataset.domain = domain;
          li.className = "answer" + (index === 0 ? " is-primary" : "");
          var state = hit ? hit.status : "";
          if (index === 0 && !hit && primaryNote) state = "invalid";
          if (state === "available") li.classList.add("is-available");
          else if (state === "registered") li.classList.add("is-taken");
          else if (state === "invalid") li.classList.add("is-invalid");
          else li.classList.add("is-checking");

          var name = li.querySelector(".answer-name");
          if (!name) {
            name = document.createElement("button");
            name.type = "button";
            name.className = "answer-name";
            name.addEventListener("click", function () {
              if (name.dataset.tld === selectedTld) return;
              selectTld(name.dataset.tld);
            });
            li.appendChild(name);
          }
          name.dataset.tld = tld;
          name.textContent = domain;

          var status = li.querySelector(".answer-status");
          if (!status) {
            status = document.createElement("span");
            status.className = "answer-status";
            li.appendChild(status);
          }
          if (state === "available") status.textContent = "Available";
          else if (state === "registered") status.textContent = "Taken";
          else if (index === 0 && primaryNote) status.textContent = primaryNote;
          else if (state === "invalid") status.textContent = "Invalid";
          else status.textContent = "";

          var action = li.querySelector(".answer-action");
          if (!action) {
            action = document.createElement("span");
            action.className = "answer-action";
            li.appendChild(action);
          }
          var link = action.querySelector(".register");
          if (state === "available") {
            if (!link) {
              link = document.createElement("a");
              link.className = "register";
              link.rel = "sponsored noopener noreferrer";
              link.target = "_blank";
              link.textContent = "Register";
              action.appendChild(link);
            }
            link.href = registerHref(domain, hit);
            link.setAttribute("aria-label", "Register " + domain);
            if (hit && hit.affiliate_url && hit.disclosure && !disclosure) disclosure = hit.disclosure;
          } else if (link) {
            link.remove();
          }
          frag.appendChild(li);
        });
        answersEl.appendChild(frag);
        Array.prototype.forEach.call(Array.prototype.slice.call(answersEl.children), function (li) {
          if (endings.indexOf(li.dataset.domain.slice(label.length)) === -1) li.remove();
        });
        answersEl.hidden = false;
        searchEl.classList.add("has-answers");
        if (disclosure) {
          disclosureEl.textContent = disclosure;
          disclosureEl.classList.add("is-on");
        } else {
          disclosureEl.classList.remove("is-on");
          disclosureEl.textContent = "";
        }
        var primary = cacheGet(label + ending);
        if (primary && primary.status === "available") compose.classList.add("is-available");
        else if (primary && primary.status === "registered") compose.classList.add("is-taken");
      }

      function cacheGet(domain) {
        var hit = cache.get(domain);
        if (!hit) return null;
        if (Date.now() - hit.at > CACHE_TTL_MS) {
          cache.delete(domain);
          return null;
        }
        return hit;
      }

      function cacheSet(domain, status, resolved, extras) {
        if (cache.size >= CACHE_MAX) {
          var oldest = cache.keys().next().value;
          cache.delete(oldest);
        }
        cache.set(domain, Object.assign({
          status: status,
          at: Date.now(),
          domain: resolved || domain
        }, extras || {}));
      }

      function debounceMs(label) {
        // Longer pause for 1–2 chars (still deciding); snappy once typing a real name.
        if (label.length >= 3) return DEBOUNCE_SHORT_MS;
        return DEBOUNCE_LONG_MS;
      }

      function selectTld(tld) {
        endingChosen = true;
        writeEnding(tld);
        closeMenu();
        scheduleCheck();
      }

      function scheduleCheck() {
        lastTypedAt = Date.now();
        primaryNote = "";
        var split = splitTyped(readField());
        if (split.ending) {
          endingChosen = true;
          var typingName = shadow.activeElement === field;
          nameInput.value = split.label;
          writeEnding(split.ending);
          if (typingName && !endingReady(split.ending)) openMenu();
          else placeCaretEnd();
        } else if (readField() !== split.label) {
          nameInput.value = split.label;
          placeCaretEnd();
        }
        ghost.hidden = !!split.label;

        var ending = readEnding() || selectedTld;
        if (!split.label) {
          if (abortController) abortController.abort();
          clearTimeout(timer);
          clearTimeout(warmTimer);
          renderAnswers();
          return;
        }

        if (!endingReady(ending)) {
          if (abortController) abortController.abort();
          clearTimeout(timer);
          clearTimeout(warmTimer);
          renderAnswers();
          return;
        }

        selectedTld = ending;
        var domain = split.label + ending;
        var cached = cacheGet(domain);
        if (cached) {
          renderAnswers();
          clearTimeout(timer);
          if (abortController) abortController.abort();
          warmOtherTlds(split.label);
          return;
        }

        renderAnswers();
        clearTimeout(timer);
        var wait = debounceMs(split.label);
        timer = setTimeout(function () {
          runCheck(domain);
        }, wait);
        warmOtherTlds(split.label);
      }

      function warmOtherTlds(label) {
        clearTimeout(warmTimer);
        if (label.length < 3) return;
        warmTimer = setTimeout(function () {
          if (normalizeLabel(nameInput.value) !== label) return;
          TLDS.forEach(function (tld) {
            if (tld === selectedTld) return;
            var other = label + tld;
            if (cacheGet(other)) return;
            fetch(
              API + "?q=" + encodeURIComponent(other) + "&area=instant_domain_search&warm=1",
              { credentials: "omit", cache: "default" }
            ).then(function (res) {
              if (!res.ok) return null;
              return res.json();
            }).then(function (data) {
              var row = data && data.results && data.results[0];
              if (!row) return;
              if (row.status === "available" || row.status === "registered" || row.status === "invalid") {
                cacheSet(other, row.status, row.domain, {
                  affiliate_url: row.affiliate_url || "",
                  disclosure: row.disclosure || "",
                  status: row.status
                });
                if (normalizeLabel(nameInput.value) === label) renderAnswers();
              }
            }).catch(function () {});
          });
        }, 160);
      }

      function runCheck(domain) {
        var cached = cacheGet(domain);
        if (cached) {
          renderAnswers();
          return;
        }

        if (abortController) abortController.abort();
        abortController = new AbortController();
        var seq = ++requestSeq;
        var started = performance.now();

        // No custom headers → avoid CORS preflight (Accept: application/json can force OPTIONS).
        fetch(
          API +
            "?q=" +
            encodeURIComponent(domain) +
            "&area=instant_domain_search",
          {
          signal: abortController.signal,
          credentials: "omit",
          cache: "default",
        })
          .then(function (res) {
            if (!res.ok) throw new Error("HTTP " + res.status);
            return res.json();
          })
          .then(function (data) {
            if (seq !== requestSeq) return;
            var row = data && data.results && data.results[0];
            if (!row) {
              primaryNote = "No result";
              renderAnswers();
              return;
            }
            var status = row.status;
            if (status === "available" || status === "registered" || status === "invalid") {
              cacheSet(domain, status, row.domain, {
                affiliate_url: row.affiliate_url || "",
                disclosure: row.disclosure || "",
                status: status
              });
            }
            renderAnswers();
            if (window.__domainSearchPerf) {
              window.__domainSearchPerf.last = {
                domain: domain,
                ms: Math.round(performance.now() - started),
                timing_ms: data.timing_ms,
                cached: row.cached,
                source: row.source,
              };
            }
          })
          .catch(function (err) {
            if (err && err.name === "AbortError") return;
            if (seq !== requestSeq) return;
            primaryNote = "Try again";
            renderAnswers();
          });
      }

      window.__domainSearchPerf = { last: null };

      function popularFrom(list) {
        var head = [];
        list.forEach(function (tld) {
          var bare = String(tld || "").replace(/^\./, "");
          if (bare && head.indexOf(bare) === -1) head.push(bare);
        });
        ["dev", "app", "me", "xyz", "info", "biz"].forEach(function (item) {
          if (head.indexOf(item) === -1) head.push(item);
        });
        return head.slice(0, 12);
      }

      function paintTlds(list) {
        TLDS = list.slice(0, 6);
        POPULAR = popularFrom(TLDS);
        if (!endingChosen) writeEnding(".com");
        var label = normalizeLabel(readField());
        if (label) {
          warmOtherTlds(label);
          renderAnswers();
        }
      }

      paintTlds(TLDS);

      var menuItems = [];
      var menuIndex = 0;

      function menuGroups(query) {
        var q = String(query || "").toLowerCase().replace(/^\./, "").replace(/[^a-z0-9.-]/g, "");
        if (!q) {
          var regions = REGIONS.filter(function (item) { return ALL.indexOf(item) !== -1; });
          var pinned = {};
          POPULAR.concat(regions).forEach(function (item) { pinned[item] = true; });
          return [
            { label: "Common", items: POPULAR },
            { label: "Regions", items: regions },
            { label: "All endings", items: ALL.filter(function (item) { return !pinned[item]; }) }
          ];
        }
        var items = ALL.filter(function (item) { return item.indexOf(q) !== -1; });
        items.sort(function (a, b) {
          var as = a.indexOf(q) === 0 ? 0 : 1;
          var bs = b.indexOf(q) === 0 ? 0 : 1;
          if (as !== bs) return as - bs;
          if (a.length !== b.length) return a.length - b.length;
          return a < b ? -1 : a > b ? 1 : 0;
        });
        return [{ label: "", items: items }];
      }

      function markMenuActive() {
        var buttons = tldOptions.querySelectorAll(".tld-option");
        Array.prototype.forEach.call(buttons, function (btn, i) {
          btn.classList.toggle("is-active", i === menuIndex);
        });
        if (buttons[menuIndex]) buttons[menuIndex].scrollIntoView({ block: "nearest" });
      }

      function renderMenu() {
        var groups = menuGroups(tldSearch.value);
        menuItems = [];
        var html = "";
        groups.forEach(function (group) {
          if (!group.items.length) return;
          if (group.label) html += '<div class="tld-group-label">' + group.label + "</div>";
          group.items.forEach(function (item) {
            var index = menuItems.length;
            menuItems.push(item);
            var selected = "." + item === selectedTld;
            html += '<button type="button" class="tld-option" role="option" data-i="' + index + '" aria-selected="' + (selected ? "true" : "false") + '"><span>.' + item + '</span><span class="tld-mark" aria-hidden="true">✓</span></button>';
          });
        });
        tldOptions.innerHTML = html || '<p class="tld-empty">No endings</p>';
        var selectedAt = menuItems.indexOf(String(selectedTld || "").replace(/^\./, ""));
        menuIndex = selectedAt >= 0 ? selectedAt : 0;
        markMenuActive();
      }

      function openMenu() {
        tldMenu.hidden = false;
        tldSuffix.setAttribute("aria-expanded", "true");
        tldSearch.value = "";
        renderMenu();
        tldSearch.focus();
      }

      function closeMenu() {
        if (tldMenu.hidden) return;
        tldMenu.hidden = true;
        tldSuffix.setAttribute("aria-expanded", "false");
      }

      function chooseEnding(item) {
        if (!item) return;
        endingChosen = true;
        writeEnding(item);
        justPicked = true;
        closeMenu();
        scheduleCheck();
        nameInput.focus();
      }

      var justPicked = false;
      var pointerInMenu = false;

      tldSuffix.addEventListener("click", function () {
        if (justPicked) return;
        if (tldMenu.hidden) openMenu();
        else closeMenu();
      });
      tldPop.addEventListener("pointerdown", function () {
        pointerInMenu = true;
      });
      document.addEventListener("pointerup", function () {
        setTimeout(function () {
          pointerInMenu = false;
          justPicked = false;
        }, 0);
      });
      tldSearch.addEventListener("input", renderMenu);
      tldSearch.addEventListener("keydown", function (e) {
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (!menuItems.length) return;
          menuIndex = (menuIndex + 1) % menuItems.length;
          markMenuActive();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (!menuItems.length) return;
          menuIndex = (menuIndex - 1 + menuItems.length) % menuItems.length;
          markMenuActive();
        } else if (e.key === "Enter") {
          e.preventDefault();
          chooseEnding(menuItems[menuIndex]);
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeMenu();
          nameInput.focus();
        }
      });
      tldOptions.addEventListener("pointerdown", function (e) {
        var btn = e.target.closest ? e.target.closest(".tld-option") : null;
        if (!btn) return;
        e.preventDefault();
        chooseEnding(menuItems[Number(btn.getAttribute("data-i"))]);
      });
      document.addEventListener("pointerdown", function (e) {
        if (tldMenu.hidden || tldPop.contains(e.target)) return;
        closeMenu();
      });
      tldPop.addEventListener("focusout", function (e) {
        if (pointerInMenu || justPicked) return;
        if (e.relatedTarget && tldPop.contains(e.relatedTarget)) return;
        closeMenu();
      });

      field.addEventListener("input", scheduleCheck);
      field.addEventListener("keydown", function (e) {
        if (e.key === ".") {
          e.preventDefault();
          openMenu();
          return;
        }
        if (e.key === "Enter") {
          e.preventDefault();
          clearTimeout(timer);
          var label = normalizeLabel(nameInput.value);
          var ending = readEnding();
          if (label && endingReady(ending)) runCheck(label + ending);
        }
      });
      field.addEventListener("paste", function (e) {
        e.preventDefault();
        var text = "";
        try {
          text = (e.clipboardData || window.clipboardData).getData("text") || "";
        } catch (_) {}
        var split = splitTyped(text);
        nameInput.value = split.label;
        if (split.ending) {
          endingChosen = true;
          writeEnding(split.ending);
        }
        scheduleCheck();
      });

      // Deep-link: ?q=name or ?q=studio.si
      try {
        var params = new URLSearchParams(window.location.search);
        var q = params.get("q") || params.get("domain") || "";
        if (q) {
          var split = splitTyped(q);
          if (split.ending) {
            endingChosen = true;
            writeEnding(split.ending);
          }
          nameInput.value = split.label;
          scheduleCheck();
        }
      } catch (_) {}

      function loadRegionalEndings() {
        var region = "";
        try {
          region = new URLSearchParams(window.location.search).get("region") || "";
        } catch (err) {}
        var url = "/api/endings";
        if (/^[A-Za-z]{2}$/.test(region)) {
          url += "?country=" + encodeURIComponent(region.toUpperCase() === "UK" ? "GB" : region.toUpperCase());
        }
        fetch(url, { credentials: "omit", cache: "default" })
          .then(function (res) {
            return res.ok ? res.json() : null;
          })
          .then(function (data) {
            if (endingChosen || !data || !data.endings) return;
            var next = data.endings.filter(function (item) {
              return /^\.[a-z0-9-]{2,24}(?:\.[a-z0-9-]{2,24})?$/.test(item);
            }).slice(0, 6);
            if (next.length < 4 || next.join() === TLDS.join()) return;
            paintTlds(next);
          })
          .catch(function () {});
      }

      function loadSoldEndings() {
        fetch("/api/tlds", { credentials: "omit", cache: "default" })
          .then(function (res) { return res.ok ? res.json() : null; })
          .then(function (data) {
            if (!data || !data.endings || data.endings.length < 100) return;
            var next = data.endings.filter(function (item) {
              return /^(?:[a-z0-9-]{2,24}\.)?[a-z]{2,24}$/.test(item);
            });
            if (next.length < 100) return;
            ALL = next;
            if (!tldMenu.hidden) renderMenu();
          })
          .catch(function () {});
      }

      loadSoldEndings();
      loadRegionalEndings();
      nameInput.focus();
      noteVisit("instant_domain_search");
    })();

    function noteVisit(area) {
      try {
        if (navigator.webdriver) return;
        var key = "fwd-audience";
        var now = new Date();
        var day = now.getFullYear() + "-"
          + String(now.getMonth() + 1).padStart(2, "0") + "-"
          + String(now.getDate()).padStart(2, "0");
        var store = {};
        try { store = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (err) { store = {}; }
        if (!store.id || !/^[A-Za-z0-9_-]{8,64}$/.test(store.id)) {
          store.id = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
        }
        if (store[area] === day) return;
        var url = "https://api.forwardslashdot.com/api/hit?area=" + encodeURIComponent(area)
          + "&actor=human&visitor=" + encodeURIComponent(store.id)
          + "&day=" + day;
        fetch(url, { mode: "cors", credentials: "omit", cache: "no-store" }).then(function (res) {
          if (!res.ok) return;
          store[area] = day;
          localStorage.setItem(key, JSON.stringify(store));
        }).catch(function () {});
        var pending = { id: store.id };
        Object.keys(store).forEach(function (name) {
          if (name !== "id" && name !== area) pending[name] = store[name];
        });
        localStorage.setItem(key, JSON.stringify(pending));
      } catch (err) {}
    }
  </script>
</body>
</html>
