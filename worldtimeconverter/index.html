        closeEditor();
        if (parsed == null) {
          showToast("Try a time like 2:15 PM or 14:15");
          return;
        }
        state.minutes = parsed;
        paint();
        commit();
        announce();
      }
      btn.addEventListener("click", function () {
        if (document.body.classList.contains("embed")) return;
        const t = formatTime(Math.floor(state.minutes / 60), state.minutes % 60).text;
        input.value = t;
        btn.hidden = true;
        input.hidden = false;
        input.focus();
        input.select();
      });
      input.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          commitEditor();
        } else if (event.key === "Escape") {
          event.preventDefault();
          closeEditor();
          btn.focus();
        }
      });
      input.addEventListener("blur", function () {
        if (!input.hidden) commitEditor();
      });
    })();

    document.getElementById("prev-day").addEventListener("click", function () { shiftDay(-1); });
    document.getElementById("next-day").addEventListener("click", function () { shiftDay(1); });
    document.getElementById("now").addEventListener("click", function () {
      const now = partsInZone(Date.now(), anchorCity().zone);
      state.year = now.year;
      state.month = now.month;
      state.day = now.day;
      state.minutes = now.hour * 60 + now.minute;
      renderAll();
      announce();
    });
    document.getElementById("date-input").addEventListener("change", function (event) {
      const bits = event.target.value.split("-").map(Number);
      if (bits.length !== 3 || !bits[0]) return;
      state.year = bits[0];
      state.month = bits[1];
      state.day = bits[2];
      renderAll();
    });

    document.querySelectorAll(".dur").forEach(function (button) {
      button.addEventListener("click", function () {
        state.duration = Number(button.dataset.dur);
        renderAll();
      });
    });

    function onWorkChange() {
      const start = Number(document.getElementById("work-start").value) * 60;
      const end = Number(document.getElementById("work-end").value) * 60;
      const note = document.getElementById("work-note");
      if (end <= start) {
        note.textContent = "The workday has to end after it starts.";
        syncChrome();
        return;
      }
      note.textContent = "";
      state.workStart = start;
      state.workEnd = end;
      renderAll();
    }
    document.getElementById("work-start").addEventListener("change", onWorkChange);
    document.getElementById("work-end").addEventListener("change", onWorkChange);

    rowsEl.addEventListener("pointerdown", function (event) {
      if (document.body.classList.contains("embed")) return;
      if (event.button) return;
      const card = event.target.closest(".dial-card");
      if (!card || event.target.closest(".row-confirm, .row-more, .band-hit")) return;
      reorder = {
        card: card,
        pointerId: event.pointerId,
        originX: event.clientX,
        originY: event.clientY,
        moved: false,
        armed: event.pointerType === "mouse",
        pointerType: event.pointerType,
        timer: 0
      };
      if (!reorder.armed) {
        reorder.timer = setTimeout(function () {
          if (!reorder || reorder.pointerId !== event.pointerId) return;
          reorder.armed = true;
        }, 220);
      }
    });
    window.addEventListener("pointermove", onReorderMove);
    window.addEventListener("pointerup", onReorderEnd);
    window.addEventListener("pointercancel", onReorderEnd);

    rowsEl.addEventListener("click", function (event) {
      if (suppressClick) {
        suppressClick = false;
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      const swiped = event.target.closest(".dial-card.is-swiped");
      if (swiped && !event.target.closest(".row-confirm")) {
        closeCardMenus();
        return;
      }
      const more = event.target.closest(".row-more");
      if (more) {
        event.preventDefault();
        event.stopPropagation();
        const card = more.closest(".dial-card");
        if (menuKey === card.dataset.key) closeRowMenu();
        else {
          const box = more.getBoundingClientRect();
          openRowMenu(card, box.right, box.bottom + 6, true);
        }
        return;
      }
      if (event.target.closest("[data-action], [data-add]")) {
        event.stopPropagation();
        closeHome();
      }
      const action = event.target.closest("[data-action]");
      if (action) {
        const key = action.closest("[data-key]").dataset.key;
        closeCardMenus();
        if (action.dataset.action === "change") openComposer(key);
        else if (action.dataset.action === "remove") removeCity(key);
        return;
      }
      if (event.target.closest("[data-add]")) {
        const adder = document.getElementById("adder");
        if (adder.classList.contains("is-open") && !state.replaceKey) closeComposer();
        else openComposer("");
        return;
      }
      const name = event.target.closest("[data-anchor]");
      if (name) {
        closeCardMenus();
        setAnchor(name.dataset.anchor);
      }
    });

    // Scrubbing works from the axis and from any bar. A mouse jumps straight to the
    // pointer. A finger waits for a sideways move, so scrolling the page never moves the time.
    let scrubbing = null;

    function beginScrub(event, target) {
      if (event.button || document.body.classList.contains("embed")) return;
      const selection = window.getSelection();
      if (selection) selection.removeAllRanges();
      scrubbing = { id: event.pointerId, x: event.clientX, y: event.clientY, live: event.pointerType !== "touch", target: target };
      try { target.setPointerCapture(event.pointerId); } catch (err) { /* synthetic pointers */ }
      if (scrubbing.live) {
        document.body.classList.add("is-scrubbing");
        state.minutes = minutesFromEvent(event);
        paint();
      }
    }

    function moveScrub(event) {
      if (!scrubbing || event.pointerId !== scrubbing.id) return;
      if (!scrubbing.live) {
        if (Math.abs(event.clientX - scrubbing.x) < 6 || Math.abs(event.clientX - scrubbing.x) < Math.abs(event.clientY - scrubbing.y)) return;
        scrubbing.live = true;
        document.body.classList.add("is-scrubbing");
      }
      state.minutes = minutesFromEvent(event);
      paint();
    }

    function endScrub(event) {
      if (!scrubbing || event.pointerId !== scrubbing.id) return;
      const tap = !scrubbing.live && event.type === "pointerup";
      if (tap) state.minutes = minutesFromEvent(event);
      const changed = scrubbing.live || tap;
      scrubbing = null;
      document.body.classList.remove("is-scrubbing");
      if (!changed) return;
      paint();
      commit();
      announce();
    }

    slider.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      beginScrub(event, slider);
    });
    rowsEl.addEventListener("pointerdown", function (event) {
      const hit = event.target.closest(".band-hit");
      if (hit) beginScrub(event, hit);
    });
    [slider, rowsEl].forEach(function (el) {
      el.addEventListener("pointermove", moveScrub);
      el.addEventListener("pointerup", endScrub);
      el.addEventListener("pointercancel", endScrub);
    });
    slider.addEventListener("selectstart", function (event) { event.preventDefault(); });

    slider.addEventListener("keydown", function (event) {
      const step = event.shiftKey ? 60 : 15;
      if (event.key === "ArrowRight" || event.key === "ArrowUp") state.minutes = Math.min(1439, state.minutes + step);
      else if (event.key === "ArrowLeft" || event.key === "ArrowDown") state.minutes = Math.max(0, state.minutes - step);
      else if (event.key === "Home") state.minutes = 0;
      else if (event.key === "End") state.minutes = 23 * 60 + 45;
      else return;
      event.preventDefault();
      paint();
      commit();
      announce();
    });

    document.addEventListener("keydown", function (event) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (document.activeElement === slider) return;
      const step = event.shiftKey ? 60 : 15;
      if (event.key === "ArrowRight") state.minutes = Math.min(1439, state.minutes + step);
      else if (event.key === "ArrowLeft") state.minutes = Math.max(0, state.minutes - step);
      else return;
      event.preventDefault();
      paint();
      commit();
      announce();
    });

    document.getElementById("toast-undo").addEventListener("click", function () {
      const step = undoStep;
      hideToast();
      if (step) step();
    });

    document.getElementById("add-city").addEventListener("click", function (event) {
      event.stopPropagation();
      closeHome();
      closeCardMenus();
      closeRowMenu();
      const adder = document.getElementById("adder");
      if (adder.classList.contains("is-open") && !state.replaceKey) closeComposer();
      else openComposer("");
    });
    document.getElementById("adder-close").addEventListener("click", function (event) {
      event.stopPropagation();
      closeComposer();
    });
    document.getElementById("adder-backdrop").addEventListener("click", function (event) {
      event.stopPropagation();
      closeComposer();
    });

    // A held finger must be able to drag a row without the page scrolling under it.
    window.addEventListener("touchmove", function (event) {
      if (reorder && reorder.armed && reorder.gesture !== "swipe" && event.cancelable) event.preventDefault();
    }, { passive: false });

    searchInput.addEventListener("input", function () {
      const query = searchInput.value.trim();
      renderChips();
      if (!query) {
        clearTimeout(placeTimer);
        placeQuery += 1;
        closeList();
        return;
      }
      const found = search(query);
      if (!found.length && query.includes("/") && safeZone(query)) {
        openResults([{ city: zoneLabel(query), region: "IANA time zone", zone: query }]);
        return;
      }
      openResults(found, found.length ? "" : "Looking…");
      clearTimeout(placeTimer);
      placeTimer = setTimeout(function () { searchPlaces(query); }, 280);
    });
    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        if (cityList.hidden) searchInput.dispatchEvent(new Event("input"));
        else moveOption(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveOption(-1);
      } else if (event.key === "Escape") {
        closeList();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const options = cityList.querySelectorAll(".option");
        if (options[activeOption]) options[activeOption].click();
      }
    });
    searchInput.addEventListener("blur", function () {
      setTimeout(closeList, 140);
    });

    function closeHome() {
      const menu = document.getElementById("home-menu");
      menu.hidden = true;
      document.getElementById("where").setAttribute("aria-expanded", "false");
    }

    function useMyLocation() {
      const place = placeForZone(state.detected);
      if (!place) return;
      if (!state.cities.some(function (city) { return city.zone === place.zone; })) {
        if (state.cities.length >= 8) state.cities.pop();
        state.cities.unshift(place);
      }
      const match = state.cities.find(function (city) { return city.zone === place.zone; });
      closeHome();
      setAnchor(keyOf(match), true);
      renderAll();
    }

    function openHome() {
      const menu = document.getElementById("home-menu");
      const button = document.getElementById("where");
      menu.replaceChildren();
      const instant = currentInstant();
      const detected = placeForZone(state.detected);
      const items = [];
      if (detected) {
        const dp = partsInZone(instant, detected.zone);
        items.push({ place: detected, follow: true, label: "Your location · " + detected.city, hint: formatTime(dp.hour, dp.minute).text + " " + dp.abbr });
      }
      state.cities.forEach(function (city) {
        if (detected && city.zone === detected.zone && city.city === detected.city) return;
        const cp = partsInZone(instant, city.zone);
        items.push({ place: city, follow: false, label: city.city, hint: formatTime(cp.hour, cp.minute).text + " " + cp.abbr });
      });
      items.forEach(function (item, index) {
        const li = document.createElement("li");
        li.setAttribute("role", "presentation");
        const choice = document.createElement("button");
        choice.type = "button";
        choice.setAttribute("role", "option");
        const selected = item.follow ? state.followDevice : keyOf(item.place) === state.anchorKey && !state.followDevice;
        choice.setAttribute("aria-selected", selected ? "true" : "false");
        choice.id = "home-opt-" + index;
        const name = document.createElement("span");
        name.textContent = item.label;
        const hint = document.createElement("span");
        hint.className = "hint";
        hint.textContent = item.hint;
        choice.append(name, hint);
        choice.addEventListener("click", function () {
          closeHome();
          if (item.follow) useMyLocation();
          else setAnchor(keyOf(item.place), false);
        });
        li.append(choice);
        menu.append(li);
      });
      menu.hidden = false;
      button.setAttribute("aria-expanded", "true");
    }

    document.getElementById("where").addEventListener("click", function () {
      const menu = document.getElementById("home-menu");
      if (menu.hidden) { closeShareMenu(); openHome(); }
      else closeHome();
    });
    rowsEl.addEventListener("contextmenu", function (event) {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      const card = event.target.closest(".dial-card");
      if (!card) return;
      event.preventDefault();
      openRowMenu(card, event.clientX, event.clientY, false);
    });
    rowsEl.addEventListener("scroll", closeRowMenu);
    document.getElementById("row-menu").addEventListener("click", function (event) {
      const item = event.target.closest("[data-menu]");
      if (!item || item.disabled || !menuKey) return;
      event.stopPropagation();
      const key = menuKey;
      closeRowMenu();
      if (item.dataset.menu === "home") setAnchor(key, false);
      else if (item.dataset.menu === "up") moveCity(key, -1);
      else if (item.dataset.menu === "down") moveCity(key, 1);
      else if (item.dataset.menu === "change") openComposer(key);
      else if (item.dataset.menu === "remove") removeCity(key);
    });
    document.addEventListener("click", function (event) {
      if (!event.target.closest(".where-wrap")) closeHome();
      if (!event.target.closest(".share-wrap")) closeShareMenu();
      if (!event.target.closest(".row-confirm")) closeCardMenus();
      if (!event.target.closest("#adder, #add-city, [data-add], #row-menu")) closeComposer();
      if (!event.target.closest("#row-menu, .row-more")) closeRowMenu();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeHome();
        closeShareMenu();
        closeCardMenus();
        closeRowMenu();
        closeComposer();
      }
    });

    document.getElementById("best").addEventListener("click", function () {
      if (this.classList.contains("is-active")) return;
      const start = Number(this.dataset.start);
      if (!Number.isFinite(start)) return;
      state.minutes = start;
      paint();
      commit();
      announce();
    });

    const SHARE_GLYPH = '<path d="M12 3.5v11.5" /><path d="m7.5 8 4.5-4.5L16.5 8" /><path d="M5.5 12.5v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6" />';
    const CHECK_GLYPH = '<path d="m5 12.5 4.5 4.5L19 7.5" />';

    function playBounce(el) {
      if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      el.classList.remove("mh-bounce");
      void el.offsetWidth;
      el.classList.add("mh-bounce");
      el.addEventListener("animationend", function () { el.classList.remove("mh-bounce"); }, { once: true });
    }

    function closeShareMenu() {
      const menu = document.getElementById("share-menu");
      const btn = document.getElementById("share");
      if (!menu || menu.hidden) return;
      menu.hidden = true;
      if (btn) btn.setAttribute("aria-expanded", "false");
    }

    function openShareMenu() {
      closeHome();
      closeRowMenu();
      const menu = document.getElementById("share-menu");
      const btn = document.getElementById("share");
      const nativeBtn = document.getElementById("share-native");
      const nativeRule = document.getElementById("share-native-rule");
      const hasNative = typeof navigator.share === "function";
      if (nativeBtn) nativeBtn.hidden = !hasNative;
      if (nativeRule) nativeRule.hidden = !hasNative;
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
    }

    function markShareCopied(toastMsg) {
      const button = document.getElementById("share");
      const glyph = button.querySelector("svg");
      const label = button.querySelector(".share-label");
      playBounce(glyph);
      glyph.innerHTML = CHECK_GLYPH;
      label.textContent = "Copied";
      button.classList.add("is-copied");
      button.setAttribute("aria-label", "Copied to clipboard");
      if (toastMsg) showToast(toastMsg);
      setTimeout(function () {
        glyph.innerHTML = SHARE_GLYPH;
        label.textContent = "Share";
        button.classList.remove("is-copied");
        button.setAttribute("aria-label", "Share this comparison");
      }, 1600);
    }

    function copyTextResilient(text, okMsg) {
      function fallbackCopy() {
        try {
          const ta = document.createElement("textarea");
          ta.value = text;
          ta.setAttribute("readonly", "");
          ta.style.position = "fixed";
          ta.style.opacity = "0";
          document.body.appendChild(ta);
          ta.select();
          const ok = document.execCommand("copy");
          document.body.removeChild(ta);
          if (ok) { markShareCopied(okMsg); return; }
        } catch (err) {}
        showToast("Could not copy automatically — copy from the address bar");
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () {
          markShareCopied(okMsg);
        }, fallbackCopy);
      } else {
        fallbackCopy();
      }
    }

    function formatUtcStamp(ms) {
      const d = new Date(ms);
      return d.getUTCFullYear()
        + String(d.getUTCMonth() + 1).padStart(2, "0")
        + String(d.getUTCDate()).padStart(2, "0")
        + "T"
        + String(d.getUTCHours()).padStart(2, "0")
        + String(d.getUTCMinutes()).padStart(2, "0")
        + "00Z";
    }

    function buildTimesBlock() {
      const snap = snapshot();
      const dateStr = snap.anchorParts.weekday + ", " + MONTHS[snap.anchorParts.month - 1] + " " + snap.anchorParts.day + ", " + snap.anchorParts.year;
      const lenStr = state.duration === 30 ? "30 min" : state.duration === 120 ? "2 hours" : "1 hour";
      const lines = [dateStr + " (" + lenStr + ")"];
      orderedPlaces(snap).forEach(function (place) {
        const endParts = partsInZone(snap.instant + state.duration * 60000, place.city.zone);
        const startStr = formatTime(place.parts.hour, place.parts.minute).text;
        const endStr = formatTime(endParts.hour, endParts.minute).text;
        const extra = place.delta === 0 ? "" : " (" + dayText(place.delta, place.parts) + ")";
        lines.push("• " + place.city.city + ": " + startStr + " – " + endStr + " " + place.parts.abbr + extra);
      });
      lines.push(location.href);
      return lines.join("\n");
    }

    function downloadIcs() {
      syncUrl();
      const snap = snapshot();
      const startMs = snap.instant;
      const endMs = startMs + state.duration * 60000;
      const summary = "Meeting — " + orderedPlaces(snap).map(function (p) { return p.city.city; }).join(" / ");
      const desc = buildTimesBlock().replace(/\n/g, "\\n");
      const ics = [
        "BEGIN:VCALENDAR",
        "VERSION:2.0",
        "PRODID:-//forwardslashdot//World Time Converter//EN",
        "CALSCALE:GREGORIAN",
        "BEGIN:VEVENT",
        "UID:" + formatUtcStamp(startMs) + "@forwardslashdot.com",
        "DTSTAMP:" + formatUtcStamp(Date.now()),
        "DTSTART:" + formatUtcStamp(startMs),
        "DTEND:" + formatUtcStamp(endMs),
        "SUMMARY:" + summary,
        "DESCRIPTION:" + desc,
        "URL:" + location.href,
        "END:VEVENT",
        "END:VCALENDAR"
      ].join("\r\n");
      const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "meeting-" + stampDate() + ".ics";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 1000);
      showToast("Calendar invite downloaded");
    }

    function openGoogleCalendar() {
      syncUrl();
      const snap = snapshot();
      const startMs = snap.instant;
      const endMs = startMs + state.duration * 60000;
      const gcal = new URL("https://calendar.google.com/calendar/render");
      gcal.searchParams.set("action", "TEMPLATE");
      gcal.searchParams.set("text", "Meeting (" + orderedPlaces(snap).map(function (p) { return p.city.city; }).join(" / ") + ")");
      gcal.searchParams.set("dates", formatUtcStamp(startMs) + "/" + formatUtcStamp(endMs));
      gcal.searchParams.set("details", buildTimesBlock());
      window.open(gcal.toString(), "_blank", "noopener,noreferrer");
    }

    document.getElementById("share").addEventListener("click", function (event) {
      event.stopPropagation();
      const menu = document.getElementById("share-menu");
      if (menu.hidden) openShareMenu();
      else closeShareMenu();
    });

    document.getElementById("share-menu").addEventListener("click", function (event) {
      const item = event.target.closest("[data-share]");
      if (!item) return;
      event.stopPropagation();
      const action = item.dataset.share;
      closeShareMenu();
      syncUrl();
      const line = document.getElementById("chat-line").textContent;
      const url = location.href;
      if (action === "link") {
        copyTextResilient(line + "\n" + url, "Link copied");
      } else if (action === "text") {
        copyTextResilient(buildTimesBlock(), "Times copied");
      } else if (action === "ics") {
        downloadIcs();
      } else if (action === "gcal") {
        openGoogleCalendar();
      } else if (action === "native" && typeof navigator.share === "function") {
        const payload = { title: document.title, text: line, url: url };
        navigator.share(payload).catch(function (err) {
          if (err && err.name === "AbortError") return;
          copyTextResilient(line + "\n" + url, "Link copied");
        });
      }
    });

    window.addEventListener("resize", paint);
  </script>
</body>
