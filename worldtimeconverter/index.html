  <style>
    /* Apple-style tokens. Light and dark follow the system. */
    :root {

      --red: #ff3b30;
      --p-work: #34c759;

    @media (prefers-color-scheme: dark) {

        --label: #f5f5f7;
        --label2: #98989d;
        --label3: #636366;
        --sep: rgba(84, 84, 88, 0.6);
        --fill: rgba(120, 120, 128, 0.24);
        --fill2: rgba(120, 120, 128, 0.36);
        --blue: #0a84ff;
        --green: #30d158;
        --green-ink: #30d158;
        --warn-ink: #ff9f0a;
        --orange: #ff9f0a;
        --red: #ff453a;
        --p-work: #30d158;
        --p-edge: rgba(255, 159, 10, 0.58);
        --p-edge-stripe: rgba(255, 159, 10, 0.88);
        --p-night: rgba(120, 120, 128, 0.24);

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    a { color: var(--blue); text-decoration: none; }

      height: 1px;

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

    /* ---------- Header ---------- */

    .ampm { margin-left: 6px; font-size: 0.3em; font-weight: 600; letter-spacing: -0.01em; color: var(--label2); }

    .summary { margin-top: 8px; font-size: 15px; font-weight: 590; color: var(--label2); }
    .summary.is-good { color: var(--green-ink); }

    /* ---------- Best window ---------- */
    .best {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      padding: 14px 16px;

    }

    .best.is-active { cursor: default; }
    .best.is-active:active { transform: none; }

    /* ---------- The day: shared axis, rows, playhead ---------- */
    .group {
      position: relative;
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .scrub {
      position: relative;
      height: 40px;
      padding: 0 var(--inset);
      cursor: ew-resize;
      touch-action: none;
      border-radius: var(--r) var(--r) 0 0;
    }
    .axis-lane { position: relative; height: 100%; }
    .axis-lane span {
      position: absolute;
      top: 10px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 590;
      color: var(--label2);
      white-space: nowrap;
    }
    .axis-lane span:first-child { transform: none; }
    .axis-lane span:nth-child(5) { transform: translateX(-100%); }
    .scrub-pearl {
      position: absolute;
      z-index: 4;
      top: 26px;
      left: calc(var(--f, 0) * 100%);
      width: 20px;
      height: 20px;
      margin-left: -10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s var(--spring);
      pointer-events: none;
    }
    body.is-scrubbing .scrub-pearl { transform: scale(1.25); }
    body.is-scrubbing { user-select: none; -webkit-user-select: none; }

    .track { position: relative; }
    .dials { position: relative; }

    /* The playhead passes behind text; a card-coloured halo keeps numerals clean. */
    .head {
      position: absolute;
      z-index: 1;
      top: -6px;
      bottom: 0;
      left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f, 0));
      width: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .head::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 14px;
      width: 2px;
      margin-left: -1px;
      border-radius: 1px;
      background: var(--blue);
    }
    .track:has(.is-swiped, .is-dragging, .row-face[style*="translate"]) .head { opacity: 0; }

    .dial-card {
      position: relative;
      overflow: hidden;
      border-top: 0.5px solid var(--sep);
      background: var(--card);
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .dial-card.is-dragging {
      z-index: 6;
      cursor: grabbing;
      touch-action: none;
      border-radius: 16px;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 16px 44px rgba(0, 0, 0, 0.22);
    }
    .dials.is-reordering { overflow: visible; }
    .group.is-full .dial-card:last-child { border-radius: 0 0 var(--r) var(--r); }

    .row-confirm {
      position: absolute;
      inset: 0 0 0 auto;
      display: flex;
    }
    .row-confirm button {
      width: calc(var(--reveal) / 2);

      border-radius: 0;

    .row-confirm [data-action="change"] { background: var(--blue); }
    .row-confirm [data-action="remove"] { background: var(--red); }
    .row-confirm button:disabled { opacity: 0.4; }

    .row-face {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      column-gap: 8px;
      align-items: center;
      padding: 12px var(--inset) 0;

    }
    .row-face[style*="translate"] { background: var(--card); transition: none; }
    .dial-card.is-swiped .row-face { background: var(--card); transform: translateX(calc(var(--reveal) * -1)); }

    .dayband-edge {
      position: absolute;

      display: flex;
      width: 100%;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 var(--inset);
      border: 0;
      border-top: 0.5px solid var(--sep);
      border-radius: 0 0 var(--r) var(--r);
      background: none;
      font-size: 17px;
      font-weight: 500;
      color: var(--blue);
      text-align: left;
    }
    .add-row:active { background: var(--fill); }
    .add-row .plus { width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--blue); color: #fff; }
    .add-row .plus svg { width: 12px; height: 12px; }

    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 6px 0; font-size: 13px; color: var(--label2); }
    .legend i { display: inline-block; width: 12px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
    .legend i.swatch-edge {
      background:
        repeating-linear-gradient(-45deg, transparent 0 2.5px, rgba(0, 0, 0, 0.24) 2.5px 4.5px),
        var(--p-edge);
    }
    .tip { padding: 10px 6px 0; font-size: 13px; color: var(--label2); }

    /* ---------- Add / change a place ---------- */
    .adder-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 39;
      background: rgba(0, 0, 0, 0.45);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .adder {
      display: none;
      margin-top: 16px;
      padding: 14px 16px 16px;
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .adder.is-open { display: block; }
    .adder-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .adder-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .adder-close {
      min-height: 32px;
      padding: 0 4px;
      border: 0;
      background: none;
      font-size: 16px;
      font-weight: 500;
      color: var(--blue);
    }
    .adder-close:active { opacity: 0.6; }
    .search { position: relative; flex: none; }
    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 12px;
      background: var(--fill);
      font-size: 17px;
      outline: none;
    }
    .search input::placeholder { color: var(--label2); }
    .search input:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 40%, transparent); }
    .search input:disabled { opacity: 0.5; }
    .adder-body { min-height: 0; }
    .results { list-style: none; margin-top: 6px; max-height: 340px; overflow: auto; }
    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 0 10px;
      border-top: 0.5px solid var(--sep);
      cursor: pointer;
    }
    .option:first-child { border-top: 0; }
    .option[aria-selected="true"] { background: var(--fill); border-radius: 10px; }
    .opt-city { font-weight: 590; }
    .opt-meta { font-size: 13px; color: var(--label2); text-align: right; }
    .no-match { padding: 18px 4px; color: var(--label2); text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      background: var(--fill);
      font-size: 15px;
      font-weight: 590;
    }
    .chip:active { background: var(--fill2); }

    @media (max-width: 640px), (hover: none) and (pointer: coarse) {
      .adder-backdrop.is-open { display: block; }
      .adder.is-open {
        position: fixed;
        z-index: 40;
        left: 12px;
        right: 12px;
        top: calc(var(--vv-top, 0px) + env(safe-area-inset-top, 0px) + 10px);
        max-height: calc(var(--vv-h, 100dvh) - env(safe-area-inset-top, 0px) - 20px);
        margin-top: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: var(--popover);
        border: 0.5px solid var(--popover-border);
        -webkit-backdrop-filter: saturate(180%) blur(28px);
        backdrop-filter: saturate(180%) blur(28px);
        box-shadow: 0 20px 52px rgba(0, 0, 0, 0.36);
      }
      .adder-body {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
        overscroll-behavior: contain;
      }
      .adder .results { max-height: none; overflow: visible; }
    }

    /* ---------- Workday ---------- */
    .workday { margin-top: 16px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
    .workday summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 16px;
      font-size: 17px;
      list-style: none;
      cursor: pointer;
    }
    .workday summary::-webkit-details-marker { display: none; }
    .workday summary::after {
      content: "";
      width: 8px;
      height: 8px;
      margin-left: 12px;
      border-right: 2px solid var(--label3);
      border-bottom: 2px solid var(--label3);
      transform: rotate(45deg);
      transition: transform 0.3s var(--spring);
    }
    .workday[open] summary::after { transform: rotate(-135deg); }
    .workday-body {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px 12px;
      padding: 4px 16px 16px;
      border-top: 0.5px solid var(--sep);
      padding-top: 14px;
      font-size: 15px;
      color: var(--label2);
    }
    .workday-body label { display: inline-flex; align-items: center; gap: 8px; }
    .workday-body select {
      height: 36px;
      padding: 0 10px;
      border: 0;
      border-radius: 10px;
      background: var(--fill);
      font-size: 15px;
      color: var(--label);
    }
    .segmented { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--fill); }
    .dur {
      min-height: 32px;
      min-width: 52px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: none;
      font-size: 13px;
      font-weight: 590;
      color: var(--label);

    @media (prefers-color-scheme: dark) { .dur[aria-pressed="true"] { background: #636366; } }
    .work-note { flex-basis: 100%; font-size: 13px; color: var(--red); }
    .work-note:empty { display: none; }

    /* ---------- Menus and toast ---------- */
    .home-menu, .row-menu, .share-menu {
      min-width: 230px;
      padding: 6px;
      border-radius: 16px;
      background: var(--popover);
      -webkit-backdrop-filter: saturate(180%) blur(30px);
      backdrop-filter: saturate(180%) blur(30px);
      box-shadow: 0 0 0 0.5px var(--popover-border), 0 16px 48px rgba(0, 0, 0, 0.34);
      animation: pop 0.22s var(--spring);
    }
    @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
    .home-menu { position: absolute; z-index: 40; top: calc(100% + 4px); right: 0; list-style: none; transform-origin: top right; }
    .share-menu { position: absolute; z-index: 50; top: calc(100% + 6px); right: 0; transform-origin: top right; }
    .home-menu button, .row-menu button, .share-menu button {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      width: 100%;
      min-height: 44px;
      padding: 0 12px;
      border: 0;
      border-radius: 10px;
      background: none;
      font-size: 16px;
      color: var(--label);
      text-align: left;
      white-space: nowrap;
    }
    .home-menu button:hover, .row-menu button:hover:not(:disabled), .share-menu button:hover:not(:disabled) { background: var(--fill); }
    .home-menu button[aria-selected="true"] { color: var(--blue); }
    .home-menu .hint, .share-menu .hint { font-size: 13px; color: var(--label2); }
    .row-menu { position: fixed; z-index: 60; }
    .row-menu button:disabled, .share-menu button:disabled { opacity: 0.35; cursor: default; }
    .row-menu [data-menu="remove"] { color: var(--red); }
    .row-menu-rule { height: 0.5px; margin: 4px 8px; background: var(--sep); }

    .toast {
      position: fixed;
      z-index: 70;
      left: 50%;
      bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      align-items: center;
      gap: 4px;
      max-width: calc(100% - 24px);
      padding: 4px 4px 4px 18px;
      border-radius: 24px;
      background: rgba(44, 44, 46, 0.94);
      color: #fff;
      font-size: 15px;
      font-weight: 500;
      -webkit-backdrop-filter: blur(20px);
      backdrop-filter: blur(20px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      opacity: 0;
      visibility: hidden;
      transform: translate(-50%, 20px);
      pointer-events: none;
      transition: opacity 0.25s, transform 0.4s var(--spring), visibility 0s 0.4s;
    }
    .toast.in { opacity: 1; visibility: visible; transform: translate(-50%, 0); pointer-events: auto; transition-delay: 0s; }
    .toast span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .toast button { min-height: 40px; padding: 0 14px; border: 0; border-radius: 20px; background: none; color: #64b5ff; font-size: 15px; font-weight: 590; }

    footer { padding: 28px 0 8px; text-align: center; }
    .foot-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
    .foot-links a { color: var(--label2); }

    /* ---------- Embed and card mode ---------- */
    body.embed header,
    body.embed footer,
    body.embed .moment-bar,
    body.embed .clock,
    body.embed .ask,
    body.embed .answer,
    body.embed .summary,
    body.embed .dst-note,
    body.embed .workday,
    body.embed .meet-box,
    body.embed .meet-note,
    body.embed .adder,
    body.embed .add-row,
    body.embed .row-confirm,
    body.embed .row-more,
    body.embed .legend,
    body.embed .tip,
    body.embed .toast { display: none; }

    body.embed .wrap { padding: 16px; }
    body.embed .moment { padding: 0 0 12px; }
    body.embed .chat-line {
      position: static;
      width: auto;
      height: auto;
      overflow: visible;
      clip: auto;
      white-space: normal;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.25;
    }
    body.embed .scrub { cursor: default; touch-action: auto; }
    body.embed .dial-card, body.embed .band-hit { cursor: default; touch-action: auto; }
    body.embed .best { margin: 16px 0 0; }
    body.embed main { display: flex; flex-direction: column; }
    body.embed .moment { display: contents; }
    body.embed .chat-line { order: 1; margin-bottom: 12px; }
    body.embed .board { order: 2; }
    body.embed .card-open-row { display: block; order: 4; margin-top: 12px; }
    body.embed .group { border-radius: var(--r); }
    body.embed .dial-card:last-child { border-radius: 0 0 var(--r) var(--r); }

    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      * { transition-duration: 0.01ms !important; animation-duration: 0.01ms !important; }
    }
  </style>

<body>
  <div class="wrap">
    <header>
      <a class="brand" href="/">
        <span class="mark" aria-hidden="true">/.</span>
        <span class="brand-name">Time</span>
      </a>
      <div class="header-actions">
        <button class="fmt-btn" id="fmt-toggle" type="button" aria-pressed="false" aria-label="Switch between 12-hour and 24-hour clock">24h</button>
        <div class="share-wrap">
          <button class="share" id="share" type="button" aria-label="Share this comparison" aria-haspopup="menu" aria-expanded="false" aria-controls="share-menu">
            <svg class="share-glyph" viewBox="0 0 24 24" fill="none" aria-hidden="true" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 3.5v11.5" />
              <path d="m7.5 8 4.5-4.5L16.5 8" />
              <path d="M5.5 12.5v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6" />
            </svg>
            <span class="share-label">Share</span>
          </button>
          <div class="share-menu" id="share-menu" role="menu" hidden>
            <button type="button" role="menuitem" data-share="link"><span>Copy link</span><span class="hint">URL</span></button>
            <button type="button" role="menuitem" data-share="text"><span>Copy times as text</span><span class="hint">Slack / Email</span></button>
            <div class="row-menu-rule" role="separator"></div>
            <button type="button" role="menuitem" data-share="ics"><span>Download .ics</span><span class="hint">Calendar</span></button>
            <button type="button" role="menuitem" data-share="gcal"><span>Google Calendar</span><span class="hint">New tab</span></button>
            <div class="row-menu-rule" id="share-native-rule" role="separator" hidden></div>
            <button type="button" role="menuitem" data-share="native" id="share-native" hidden><span>System share…</span></button>
          </div>
        </div>
      </div>
    </header>

    <main>
      <section class="moment" aria-labelledby="ask">
        <div class="moment-bar">
          <div class="date-nav">
            <button class="icon-btn" id="prev-day" type="button" aria-label="Previous day">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 L5 8 L10 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <label class="date-face">
              <span id="date-text">Today</span>
              <input id="date-input" type="date" aria-label="Choose a date" />
            </label>
            <button class="icon-btn" id="next-day" type="button" aria-label="Next day">
              <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3 L11 8 L6 13" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="moment-actions">
            <div class="where-wrap">
              <button class="where" id="where" type="button" aria-label="Change home city" aria-haspopup="listbox" aria-expanded="false" aria-controls="home-menu"></button>
              <ul class="home-menu" id="home-menu" role="listbox" hidden></ul>
            </div>
            <button class="text-btn" id="now" type="button">Now</button>
          </div>
        </div>
        <div class="clock" id="clock">
          <button class="clock-btn" id="clock-btn" type="button" aria-label="Edit time" title="Click to type an exact time">
            <span id="clock-hm">–:–</span><span class="ampm" id="clock-ampm"></span>
          </button>
          <input class="clock-input" id="clock-input" type="text" inputmode="text" autocomplete="off" spellcheck="false" aria-label="Type a time such as 2:15 PM or 14:15" hidden />
        </div>
        <h1 class="ask" id="ask">What time is it?</h1>
        <p class="answer" id="answer"></p>
        <p class="chat-line" id="chat-line"></p>
        <p class="summary" id="summary" hidden></p>
        <p class="dst-note" id="dst-note" hidden></p>
        <p class="card-open-row"><a class="card-open" id="card-open" href="">Open the day</a></p>
      </section>

      <section class="board" id="board" aria-label="Cities on one day">

        <div class="meet-box" id="meet-box" hidden>

          <div class="compromises" id="compromises"></div>
        </div>
        <div class="group" id="group">
          <div class="scrub" id="slider" role="slider" tabindex="0" aria-valuemin="0" aria-valuemax="1439" aria-label="Time of day" aria-describedby="chat-line">
            <div class="axis-lane" id="axis-lane" aria-hidden="true">
              <span style="left: 0">12 AM</span><span style="left: 25%">6 AM</span><span style="left: 50%">12 PM</span><span style="left: 75%">6 PM</span><span style="left: 100%">12 AM</span>
              <i class="scrub-pearl"></i>
            </div>
          </div>
          <div class="track" id="track">
            <div class="dials" id="rows"></div>
            <div class="head" aria-hidden="true"></div>
          </div>
          <button class="add-row" id="add-city" data-add="1" type="button" aria-expanded="false">
            <span class="plus" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M8 2.5v11M2.5 8h11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
            <span>Add a city</span>
          </button>
        </div>
        <div class="adder-backdrop" id="adder-backdrop" aria-hidden="true"></div>
        <div class="adder" id="adder">
          <div class="adder-head">
            <p class="adder-title" id="adder-title">Add a city</p>
            <button class="adder-close" id="adder-close" type="button">Cancel</button>

            <label class="sr" for="city-search">Add a city</label>
            <input id="city-search" type="text" placeholder="Add a place" role="combobox" aria-expanded="false" aria-autocomplete="list" aria-controls="city-list" autocomplete="off" autocapitalize="off" spellcheck="false" />
          </div>
          <div class="adder-body">
            <ul class="results" id="city-list" role="listbox" hidden></ul>
            <div class="chips" id="chips"></div>
          </div>
        </div>
        <p class="legend">
          <span><i style="background: var(--p-work)"></i>Workday</span>
          <span><i class="swatch-edge"></i>Early or late</span>
          <span><i style="background: var(--p-night)"></i>Off hours</span>

        <p class="tip" id="tip">Drag along a bar to pick a time. Drag a city to reorder it, or use its ⋯ menu.</p>

              <button class="dur" type="button" data-dur="60">1h</button>
              <button class="dur" type="button" data-dur="120">2h</button>

      </section>
      <div class="row-menu" id="row-menu" role="menu" hidden>

        <button type="button" role="menuitem" data-menu="up">Move up</button>
        <button type="button" role="menuitem" data-menu="down">Move down</button>
        <div class="row-menu-rule" role="separator"></div>
        <button type="button" role="menuitem" data-menu="change">Change</button>
        <button type="button" role="menuitem" data-menu="remove">Delete</button>
      </div>

      <div class="toast" id="toast" role="status"><span id="toast-text"></span><button id="toast-undo" type="button">Undo</button></div>
    </main>

    <footer>
      <p class="foot-links">
        <a href="/llms.txt">llms.txt</a>
        <a id="plain-text-link" href="/time.txt">plain text</a>
        <a href="https://api.forwardslashdot.com/llms.txt">domain API</a>
      </p>
    </footer>
  </div>

  <script>
    const STORAGE = "forwardslashdot-time";
    const SUGGEST = ["New York", "London", "Tokyo", "Sydney", "Paris", "Singapore", "Dubai", "Los Angeles"];
    const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    const MONTHS_SHORT = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
    const FALLBACK = [
      { city: "New York", region: "United States", zone: "America/New_York", aliases: ["nyc"] },
      { city: "Los Angeles", region: "United States", zone: "America/Los_Angeles", aliases: ["la"] },
      { city: "San Francisco", region: "United States", zone: "America/Los_Angeles", aliases: ["sf"] },
      { city: "Chicago", region: "United States", zone: "America/Chicago", aliases: [] },
      { city: "London", region: "United Kingdom", zone: "Europe/London", aliases: ["uk"] },
      { city: "Paris", region: "France", zone: "Europe/Paris", aliases: [] },
      { city: "Berlin", region: "Germany", zone: "Europe/Berlin", aliases: [] },
      { city: "Dubai", region: "United Arab Emirates", zone: "Asia/Dubai", aliases: [] },
      { city: "Mumbai", region: "India", zone: "Asia/Kolkata", aliases: [] },
      { city: "Singapore", region: "Singapore", zone: "Asia/Singapore", aliases: [] },
      { city: "Hong Kong", region: "China", zone: "Asia/Hong_Kong", aliases: [] },
      { city: "Tokyo", region: "Japan", zone: "Asia/Tokyo", aliases: [] },
      { city: "Sydney", region: "Australia", zone: "Australia/Sydney", aliases: [] },
      { city: "São Paulo", region: "Brazil", zone: "America/Sao_Paulo", aliases: ["sao paulo"] },
      { city: "Phoenix", region: "United States", zone: "America/Phoenix", aliases: [] },
      { city: "Kathmandu", region: "Nepal", zone: "Asia/Kathmandu", aliases: [] },
      { city: "UTC", region: "Coordinated Universal Time", zone: "Etc/UTC", aliases: ["utc"] }
    ];

    function defaultHour24() {
      try {
        return Intl.DateTimeFormat().resolvedOptions().hour12 === false;
      } catch (err) {
        return false;

        const instant = civilToInstant(state.year, state.month, state.day, start, anchor.zone);
        const check = partsInZone(instant, anchor.zone);
        if (check.year !== state.year || check.month !== state.month || check.day !== state.day) continue;
        if (check.hour * 60 + check.minute !== start) continue;
        const held = state.cities.map(function (city) { return holds(instant, duration, city.zone); });
        const workCount = held.filter(function (item) { return item === "work"; }).length;
        const score = held.reduce(function (sum, item) {
          return sum + (item === "work" ? 2 : item === "night" ? 0 : 1);
        }, 0);
        candidates.push({ start: start, instant: instant, held: held, score: score, all: workCount === state.cities.length });
      }
      if (!candidates.length) return [];
      let pool = candidates.filter(function (item) { return item.all; });
      if (!pool.length) {
        const best = Math.max.apply(null, candidates.map(function (item) { return item.score; }));
        pool = candidates.filter(function (item) { return item.score === best; });
      }
      pool.sort(function (a, b) { return a.start - b.start; });
      const chosen = [];
      pool.forEach(function (item) {
        if (chosen.length >= 4) return;
        if (chosen.some(function (prev) { return Math.abs(item.start - prev.start) < duration; })) return;
        chosen.push(item);
      });
      return chosen;
    }

    function segmentPeriod(city, hour) {
      const instant = civilToInstant(state.year, state.month, state.day, hour * 60 + 30, anchorCity().zone);
      const parts = partsInZone(instant, city.zone);
      return classify(parts.hour * 60 + parts.minute);
    }

    function paint() {
      const snap = snapshot();
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute);
      document.getElementById("clock-hm").textContent = time.h + ":" + time.m;
      document.getElementById("clock-ampm").textContent = time.suffix;
      const where = document.getElementById("where");
      where.replaceChildren();
      where.append(document.createTextNode(snap.anchor.city + " "));
      const abbr = document.createElement("span");
      abbr.textContent = snap.anchorParts.abbr;
      where.append(abbr);
      const yours = snap.anchor.zone === state.detected;
      where.setAttribute("aria-label", (yours ? "Your location, " : "Home city, ") + snap.anchor.city + " " + snap.anchorParts.abbr + ". Change home city.");

      const live = partsInZone(Date.now(), snap.anchor.zone);
      const noon = partsInZone(civilToInstant(state.year, state.month, state.day, 12 * 60, snap.anchor.zone), snap.anchor.zone);
      const dateCore = noon.weekday + ", " + MONTHS[state.month - 1] + " " + state.day;
      document.getElementById("date-text").textContent = state.year === live.year ? dateCore : dateCore + ", " + state.year;
      document.getElementById("date-input").value = stampDate();
      const atNow = sameDay(live, state) && state.minutes === live.hour * 60 + live.minute;
      document.getElementById("now").setAttribute("aria-pressed", atNow ? "true" : "false");

      const summary = summaryInfo(snap.places);
      const summaryEl = document.getElementById("summary");
      summaryEl.hidden = !summary;
      summaryEl.className = "summary" + (summary ? " " + summary.tone : "");
      summaryEl.textContent = summary ? summary.text : "";
      if (summary) fitSummary();
      const line = fillChatLine(snap);
      const question = fillAsk(snap);

      const f = state.minutes / 1440;
      const durF = state.duration / 1440;
      const spanW = Math.min(durF, 1 - f);
      const spanWrap = Math.max(0, (f + durF) - 1);
      groupEl.style.setProperty("--f", f.toFixed(5));
      groupEl.style.setProperty("--span-w", spanW.toFixed(5));
      groupEl.style.setProperty("--span-wrap", spanWrap.toFixed(5));
      slider.setAttribute("aria-valuenow", String(state.minutes));
      slider.setAttribute("aria-valuetext", line);
      document.title = question;
      const open = document.getElementById("card-open");
      if (open) {
        const bare = new URL(location.href);
        bare.searchParams.delete("embed");
        bare.searchParams.delete("card");
        bare.searchParams.delete("format");
        open.href = bare.pathname + bare.search;
      }

      snap.places.forEach(function (place) {
        const row = rowsEl.querySelector('[data-key="' + CSS.escape(keyOf(place.city)) + '"]');
        if (!row) return;
        const clock = formatTime(place.parts.hour, place.parts.minute);
        const hm = row.querySelector("[data-time]");
        hm.textContent = clock.h + ":" + clock.m;
        const suffix = document.createElement("small");
        suffix.textContent = clock.suffix;
        hm.append(suffix);
        const wday = row.querySelector("[data-wday]");
        if (place.delta === 0) {
          wday.hidden = true;
          wday.textContent = "";
        } else {
          wday.hidden = false;
          wday.textContent = place.parts.weekday.slice(0, 3);
        }
        const yours = place.city.zone === state.detected;
        let metaText = (yours ? "Your location" : place.offsetLabel) + " · " + place.parts.abbr;
        if (BC_PCT_ZONES[place.city.zone]) {
          metaText = (yours ? "" : place.offsetLabel + " · ") + "PCT · UTC−7 all year";
        }
        const metaEl = row.querySelector("[data-meta]");
        metaEl.textContent = metaText;
        metaEl.title = BC_PCT_ZONES[place.city.zone]
          ? "British Columbia stays on Pacific Time (PCT, UTC−7) all year."
          : metaText;
        const when = row.querySelector("[data-when]");
        when.textContent = place.delta === 0 ? "" : dayText(place.delta, place.parts);
        when.hidden = place.delta === 0;
        const wrapEl = row.querySelector(".band-span-wrap");
        if (wrapEl) wrapEl.hidden = spanWrap <= 0.0005;
        row.classList.toggle("is-home", keyOf(place.city) === state.anchorKey);
      });

      const best = document.getElementById("best");
      const start = Number(best.dataset.start);
      if (best.dataset.range && Number.isFinite(start)) {
        const endMin = Number(best.dataset.end);
        const already = snap.places.every(function (place) { return place.period === "work"; });
        const inside = Number.isFinite(endMin)
          ? (state.minutes >= start && state.minutes + state.duration <= endMin)
          : (state.minutes >= start && state.minutes < start + state.duration);
        const inGood = already || inside;
        best.hidden = false;
        best.classList.toggle("is-active", inGood);
        best.textContent = inGood
          ? "In everyone's workday · " + best.dataset.range + " " + snap.anchor.city
          : best.dataset.range + " " + snap.anchor.city + " · everyone is in their workday";
        best.setAttribute("aria-label", best.textContent);
        best.setAttribute("aria-pressed", inGood ? "true" : "false");
      }
      document.querySelectorAll(".comp-btn").forEach(function (btn) {
        const s = Number(btn.dataset.start);
        btn.setAttribute("aria-pressed", s === state.minutes ? "true" : "false");
      });
      const fmtBtn = document.getElementById("fmt-toggle");
      if (fmtBtn) {
        fmtBtn.textContent = state.hour24 ? "24h" : "12h";
        fmtBtn.setAttribute("aria-pressed", state.hour24 ? "true" : "false");
      }
      document.querySelectorAll("[data-fmt]").forEach(function (btn) {
        btn.setAttribute("aria-pressed", (btn.dataset.fmt === "24") === state.hour24 ? "true" : "false");
      });
      const workOpen = formatTime(Math.floor(state.workStart / 60), state.workStart % 60).text;
      const workClose = formatTime(Math.floor(state.workEnd / 60) % 24, state.workEnd % 60).text;
      const lengthLabel = state.duration === 30 ? "30 min" : state.duration === 120 ? "2 hours" : "1 hour";
      document.getElementById("workday-summary").textContent = "Workday " + workOpen + " – " + workClose + " · " + lengthLabel + " · " + (state.hour24 ? "24h" : "12h");
    }

    function sameDay(parts, clock) {
      return parts.year === clock.year && parts.month === clock.month && parts.day === clock.day;
    }

    function orderedPlaces(snap) {
      const home = [];
      const rest = [];
      snap.places.forEach(function (place) {
        if (keyOf(place.city) === state.anchorKey) home.push(place);
        else rest.push(place);
      });
      return home.concat(rest);
    }

    function placeLine(place) {
      const time = formatTime(place.parts.hour, place.parts.minute).text;
      const extra = place.delta === 0 ? "" : " " + dayText(place.delta, place.parts).toLowerCase();
      return time + " " + place.city.city + extra;
    }

    function fillAsk(snap) {
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute).text;
      const question = "What time is " + time + " in " + snap.anchor.city + "?";
      document.getElementById("ask").textContent = question;
      const answer = document.getElementById("answer");
      const others = orderedPlaces(snap).filter(function (place) {
        return keyOf(place.city) !== state.anchorKey;
      });
      answer.replaceChildren();
      if (!others.length) {
        answer.textContent = snap.anchorParts.weekday + ", " + MONTHS[snap.anchorParts.month - 1] + " " + snap.anchorParts.day;
      } else {
        others.forEach(function (place) {
          const bit = document.createElement("span");
          bit.className = "chat-bit";
          const clock = formatTime(place.parts.hour, place.parts.minute).text;
          const extra = place.delta === 0 ? "" : dayText(place.delta, place.parts).toLowerCase() + " ";
          bit.textContent = clock + " " + extra + "in " + place.city.city;
          answer.append(bit);
        });
      }
      const bits = others.map(function (place) {
        const clock = formatTime(place.parts.hour, place.parts.minute).text;
        const extra = place.delta === 0 ? "" : dayText(place.delta, place.parts).toLowerCase() + " ";
        return clock + " " + extra + "in " + place.city.city;
      });
      let sentence = time + " in " + snap.anchor.city + ".";
      if (bits.length === 1) sentence = time + " in " + snap.anchor.city + " is " + bits[0] + ".";
      else if (bits.length > 1) sentence = time + " in " + snap.anchor.city + " is " + bits.slice(0, -1).join(", ") + " and " + bits[bits.length - 1] + ".";
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", sentence);
      return question;
    }

    function fillChatLine(snap) {
      const el = document.getElementById("chat-line");
      const ordered = orderedPlaces(snap);
      el.replaceChildren();
      ordered.forEach(function (place, index) {
        if (index) el.append(document.createTextNode(" \u00b7 "));
        const bit = document.createElement("span");
        bit.className = "chat-bit";
        bit.textContent = placeLine(place);
        el.append(bit);
      });
      return el.textContent;
    }

    // Each strip shows what the shared day looks like in that city, half an hour at a time.
    function paintBand(el, city, instants) {
      if (!el) return;
      const tone = { work: "var(--p-work)", early: "var(--p-edge)", late: "var(--p-edge)", night: "var(--p-night)" };
      const runs = [];
      const edgeRuns = [];
      instants.forEach(function (instant, slot) {
        const local = partsInZone(instant, city.zone);
        const p = classify(local.hour * 60 + local.minute);
        const color = tone[p];
        const last = runs[runs.length - 1];
        if (last && last.color === color) last.to = slot + 1;
        else runs.push({ color: color, from: slot, to: slot + 1 });
        const isEdge = p === "early" || p === "late";
        const lastEdge = edgeRuns[edgeRuns.length - 1];
        if (lastEdge && lastEdge.on === isEdge) lastEdge.to = slot + 1;
        else edgeRuns.push({ on: isEdge, from: slot, to: slot + 1 });
      });
      const stops = runs.map(function (run) {
        return run.color + " " + (run.from / 48 * 100).toFixed(3) + "% " + (run.to / 48 * 100).toFixed(3) + "%";
      });
      el.style.setProperty("--strip", "linear-gradient(to right, " + stops.join(", ") + ")");
      const edgeOverlay = el.querySelector(".dayband-edge");
      if (edgeOverlay) {
        const maskStops = edgeRuns.map(function (run) {
          return (run.on ? "#000" : "transparent") + " " + (run.from / 48 * 100).toFixed(3) + "% " + (run.to / 48 * 100).toFixed(3) + "%";
        });
        edgeOverlay.style.setProperty("--edge-mask", "linear-gradient(to right, " + maskStops.join(", ") + ")");
      }
      const open = formatTime(Math.floor(state.workStart / 60), state.workStart % 60).text;
      const close = formatTime(Math.floor(state.workEnd / 60) % 24, state.workEnd % 60).text;
      el.parentNode.title = "Workday " + open + " to " + close + " in " + city.city + ". Drag to pick a time.";
      el.setAttribute("aria-hidden", "true");
    }

    function renderTicks() {
      const spans = laneEl.querySelectorAll("span");
      const labels = state.hour24
        ? ["00:00", "06:00", "12:00", "18:00", "24:00"]
        : ["12 AM", "6 AM", "12 PM", "6 PM", "12 AM"];
      spans.forEach(function (sp, i) {
        if (labels[i] != null) sp.textContent = labels[i];
      });
    }

    function renderRows() {
      closeRowMenu();
      rowsEl.innerHTML = "";
      const anchor = anchorCity();
      const instants = [];
      for (let slot = 0; slot < 48; slot += 1) {
        instants.push(civilToInstant(state.year, state.month, state.day, slot * 30 + 15, anchor.zone));
      }
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      state.cities.forEach(function (city) {
        const home = keyOf(city) === state.anchorKey;
        const card = document.createElement("article");
        card.className = "dial-card " + (home ? "is-home" : "is-chip");
        card.dataset.key = keyOf(city);

        const name = document.createElement("button");
        name.type = "button";
        name.className = "city-name";
        name.dataset.anchor = keyOf(city);
        name.textContent = city.city;
        name.setAttribute("aria-pressed", home ? "true" : "false");
        name.title = "Show the day in " + city.city + " time";
        const sub = document.createElement("p");
        sub.className = "sub";
        const meta = document.createElement("span");
        meta.className = "who-meta";
        meta.dataset.meta = "1";
        const when = document.createElement("b");
        when.className = "when";
        when.dataset.when = "1";
        sub.append(meta, when);
        const who = document.createElement("div");
        who.className = "who";
        who.append(name, sub);

        const time = document.createElement("div");
        time.className = "who-time";
        const hm = document.createElement("span");
        hm.dataset.time = "1";
        const wday = document.createElement("span");
        wday.className = "wday";
        wday.dataset.wday = "1";
        wday.hidden = true;
        time.append(hm, wday);

        const more = document.createElement("button");
        more.type = "button";
        more.className = "row-more";
        more.setAttribute("aria-label", "Actions for " + city.city);
        more.setAttribute("aria-haspopup", "menu");
        more.setAttribute("aria-expanded", "false");
        more.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="1.15" fill="currentColor"/><circle cx="8" cy="8" r="1.15" fill="currentColor"/><circle cx="12.8" cy="8" r="1.15" fill="currentColor"/></svg>';

        const hit = document.createElement("div");
        hit.className = "band-hit";
        const band = document.createElement("div");
        band.className = "dayband";
        band.dataset.band = "1";
        const edgeOverlay = document.createElement("div");
        edgeOverlay.className = "dayband-edge";
        const spanBar = document.createElement("div");
        spanBar.className = "band-span";
        const spanWrapBar = document.createElement("div");
        spanWrapBar.className = "band-span-wrap";
        spanWrapBar.hidden = true;
        band.append(edgeOverlay, spanBar, spanWrapBar);
        hit.append(band);
        paintBand(band, city, instants);

        const face = document.createElement("div");
        face.className = "row-face";
        face.append(who, time, more, hit);

        const confirm = document.createElement("div");
        confirm.className = "row-confirm";
        confirm.hidden = true;
        [
          { action: "change", label: "Change" },
          { action: "remove", label: "Delete", disabled: state.cities.length === 1 }
        ].forEach(function (item) {
          const choice = document.createElement("button");
          choice.type = "button";
          choice.dataset.action = item.action;
          choice.textContent = item.label;
          choice.tabIndex = -1;
          choice.setAttribute("aria-label", item.label + " " + city.city);
          if (item.disabled) choice.disabled = true;
          confirm.append(choice);
        });

        card.tabIndex = 0;
        card.addEventListener("keydown", function (event) {
          if (event.target !== card) return;
          if (event.key === "Delete" || event.key === "Backspace") {
            event.preventDefault();
            openCardMenu(card, true);
            return;
          }
          const up = event.key === "ArrowLeft" || event.key === "ArrowUp";
          const down = event.key === "ArrowRight" || event.key === "ArrowDown";
          if (!up && !down) return;
          event.preventDefault();
          event.stopPropagation();
          moveCity(card.dataset.key, up ? -1 : 1);
        });
        card.setAttribute("aria-label", city.city + (finePointer
          ? ". Drag to reorder. Press Delete to change or remove."
          : ". Drag to reorder, or swipe left to change or delete."));
        card.append(confirm, face);
        rowsEl.append(card);
      });
      const full = state.cities.length >= 8;
      document.getElementById("add-city").hidden = full;
      document.getElementById("group").classList.toggle("is-full", full);
      document.getElementById("tip").textContent = finePointer
        ? "Drag along a bar to pick a time. Drag a city to reorder it, or use its \u22ef menu to change or delete it."
        : "Drag along a bar to pick a time. Hold and drag a city to reorder it. Swipe it left to change or delete.";
    }

    function fullOverlapRange() {
      const anchor = anchorCity();
      const duration = state.duration;
      let first = null;
      let last = null;
      for (let start = 0; start + duration <= 1440; start += 30) {
        const instant = civilToInstant(state.year, state.month, state.day, start, anchor.zone);
        const check = partsInZone(instant, anchor.zone);
        if (check.year !== state.year || check.month !== state.month || check.day !== state.day) continue;
        if (check.hour * 60 + check.minute !== start) continue;
        const ok = state.cities.every(function (city) { return holds(instant, duration, city.zone) === "work"; });
        if (ok) {
          if (first === null) first = start;
          last = start + duration;
        } else if (first !== null) {
          break;
        }
      }
      return first === null ? null : { start: first, end: last };
    }

    function describeOutside(held) {
      const notes = [];
      held.forEach(function (status, index) {
        if (status === "work") return;
        const city = state.cities[index];
        if (!city) return;
        const label = status === "early" ? "early" : status === "late" ? "late" : "off hours";
        notes.push(label + " in " + city.city);
      });
      if (!notes.length) return "everyone in workday";
      if (notes.length <= 2) return notes.join(", ");
      return notes.slice(0, 2).join(", ") + " +" + (notes.length - 2);
    }

    function renderMeetings() {
      document.querySelectorAll(".dur").forEach(function (button) {
        button.setAttribute("aria-pressed", Number(button.dataset.dur) === state.duration ? "true" : "false");
      });
      const best = document.getElementById("best");
      const box = document.getElementById("meet-box");
      const note = document.getElementById("meet-note");
      const sub = document.getElementById("meet-sub");
      const compEl = document.getElementById("compromises");
      compEl.replaceChildren();
      if (state.cities.length < 2) {
        best.hidden = true;
        best.removeAttribute("data-start");
        best.removeAttribute("data-end");
        best.removeAttribute("data-range");
        box.hidden = true;
        return;
      }
      const windows = findWindows();
      const good = windows.find(function (item) { return item.all; });
      if (good) {
        const span = fullOverlapRange();
        const startMin = span ? span.start : good.start;
        const endMin = span ? span.end : good.start + state.duration;
        const startText = formatTime(Math.floor(startMin / 60), startMin % 60).text;
        const endText = formatTime(Math.floor(endMin / 60) % 24, endMin % 60).text;
        const rangeText = startText + " – " + endText;
        best.dataset.start = String(startMin);
        best.dataset.end = String(endMin);
        best.dataset.range = rangeText;
        best.hidden = false;
        box.hidden = true;
      } else {
        best.hidden = true;
        best.removeAttribute("data-start");
        best.removeAttribute("data-end");
        best.removeAttribute("data-range");
        const length = state.duration === 30 ? "30-minute" : state.duration === 120 ? "2-hour" : "1-hour";
        note.textContent = "No " + length + " window lands in every workday.";
        const closest = windows.slice(0, 3);
        sub.textContent = closest.length ? "Closest options in " + anchorCity().city + " time:" : "";
        sub.hidden = !closest.length;
        closest.forEach(function (item) {
          const btn = document.createElement("button");
          btn.type = "button";
          btn.className = "comp-btn";
          btn.dataset.start = String(item.start);
          btn.setAttribute("aria-pressed", item.start === state.minutes ? "true" : "false");
          const dot = document.createElement("span");
          dot.className = "comp-dot";
          dot.setAttribute("aria-hidden", "true");
          const t = document.createElement("span");
          t.textContent = formatTime(Math.floor(item.start / 60), item.start % 60).text;
          const why = document.createElement("span");
          why.className = "comp-why";
          why.textContent = describeOutside(item.held);
          btn.append(dot, t, why);
          btn.addEventListener("click", function () {
            state.minutes = item.start;
            paint();
            commit();
            announce();
          });
          compEl.append(btn);
        });
        box.hidden = false;
      }
    }

    function renderChips() {
      chipsEl.innerHTML = "";
      const query = searchInput.value.trim();
      if (query || state.cities.length >= 8) {
        chipsEl.hidden = true;
        return;
      }
      const have = new Set(state.cities.map(function (city) { return city.city; }));
      const picks = SUGGEST.filter(function (name) { return !have.has(name); }).slice(0, 4);
      chipsEl.hidden = picks.length === 0;
      picks.forEach(function (name) {
        const city = CITIES.find(function (item) { return item.city === name; });
        if (!city) return;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.textContent = name;
        button.addEventListener("click", function () { addCity(city); });
        chipsEl.append(button);
      });
    }

    function syncChrome() {
      const full = state.cities.length >= 8;
      searchInput.disabled = full;
      searchInput.placeholder = full ? "Eight places is enough to compare" : "Add a place";
      document.getElementById("work-start").value = String(Math.floor(state.workStart / 60));
      document.getElementById("work-end").value = String(Math.floor(state.workEnd / 60) === 24 ? 24 : Math.floor(state.workEnd / 60));
    }

    function renderDstNote() {
      const el = document.getElementById("dst-note");
      if (!el) return;
      const msg = findUpcomingDst();
      el.hidden = !msg;
      el.textContent = msg;
    }

    function renderAll() {
      renderTicks();
      renderRows();
      renderMeetings();
      renderDstNote();
      renderChips();
      syncChrome();
      paint();
      commit();
    }

    function commit() {
      syncUrl();
      save();
    }

    function announce() {
      const snap = snapshot();
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute);
      const others = snap.places.filter(function (place) {
        return keyOf(place.city) !== state.anchorKey;
      }).map(placeLine);
      const extra = summaryLine(snap.places);
      let text = time.text + " in " + snap.anchor.city;
      if (others.length) text += ". " + others.join(", ");
      if (extra) text += ". " + extra;
      live.textContent = text + ".";
    }

    function stampDate() {
      return state.year + "-" + String(state.month).padStart(2, "0") + "-" + String(state.day).padStart(2, "0");
    }

    function syncUrl() {
      const params = new URLSearchParams();
      params.set("cities", state.cities.map(linkToken).join(","));
      params.set("anchor", state.anchorKey);
      const hh = String(Math.floor(state.minutes / 60)).padStart(2, "0");

    function placeQueryParts(raw) {
      const words = foldQuery(raw).split(" ").filter(Boolean);
      const hints = [];
      const name = [];
      words.forEach(function (word) {
        if (REGION_HINT[word]) hints.push(REGION_HINT[word]);
        else name.push(word);
      });
      return { name: name.join(" "), hints: hints };
    }

    function placeFromGeo(row) {
      if (!row || !row.name || !row.timezone || !safeZone(row.timezone)) return null;
      if (typeof row.latitude !== "number" || typeof row.longitude !== "number") return null;
      const region = [];
      if (row.admin1 && foldQuery(row.admin1) !== foldQuery(row.name)) region.push(row.admin1);
      if (row.country) region.push(row.country);
      return {
        city: row.name,
        region: region.join(", ") || row.country || zoneLabel(row.timezone),
        zone: row.timezone,
        lat: row.latitude,
        lon: row.longitude
      };
    }

    function rankPlaces(rows, hints) {
      const populated = rows.filter(function (row) { return String(row.feature_code || "").indexOf("PPL") === 0; });
      const pool = populated.length ? populated : rows;
      return pool.map(function (row) {
        const place = placeFromGeo(row);
        if (!place) return null;
        const blob = foldQuery([row.name, row.admin1, row.admin2, row.country, row.country_code].filter(Boolean).join(" "));
        let score = Math.min(row.population || 0, 2000000) / 100000;
        hints.forEach(function (hint) { score += blob.includes(hint) ? 40 : -25; });
        return { score: score, place: place };
      }).filter(Boolean).sort(function (a, b) { return b.score - a.score; });
    }

    function searchPlaces(query) {
      const parts = placeQueryParts(query);
      if (parts.name.length < 2) {
        const local = search(query);
        openResults(local, local.length ? "" : "No matching place");
        return;
      }
      const id = ++placeQuery;
      const url = "https://geocoding-api.open-meteo.com/v1/search?name=" + encodeURIComponent(parts.name) + "&count=10&language=en&format=json";
      fetch(url).then(function (res) { return res.ok ? res.json() : null; }).then(function (data) {
        if (id !== placeQuery || searchInput.value.trim() !== query) return;
        const local = search(query);
        const seen = {};
        local.forEach(function (city) { seen[keyOf(city)] = true; });
        const merged = local.slice();
        rankPlaces((data && data.results) || [], parts.hints).forEach(function (item) {
          if (merged.length >= 8 || seen[keyOf(item.place)]) return;
          seen[keyOf(item.place)] = true;
          merged.push(item.place);
        });
        openResults(merged, "No matching place");
      }).catch(function () {
        if (id !== placeQuery || searchInput.value.trim() !== query) return;
        const local = search(query);
        openResults(local, "No matching place");
      });

    function moveCity(key, dir) {
      const index = state.cities.findIndex(function (city) { return keyOf(city) === key; });
      const next = index + dir;
      if (index < 0 || next < 0 || next >= state.cities.length) return;
      state.customOrder = true;
      const cities = state.cities.slice();
      const moved = cities[index];
      cities[index] = cities[next];

    function shiftLayout(card, dir) {
      const neighbor = dir < 0 ? card.previousElementSibling : card.nextElementSibling;
      if (!neighbor || !neighbor.classList.contains("dial-card")) return;
      const cards = Array.from(rowsEl.querySelectorAll(".dial-card"));
      const before = new Map(cards.map(function (el) { return [el, el.getBoundingClientRect()]; }));
      const layoutBefore = before.get(card);
      if (dir < 0) rowsEl.insertBefore(card, neighbor);
      else rowsEl.insertBefore(neighbor, card);
      const layoutAfter = card.getBoundingClientRect();
      reorder.originX += layoutAfter.left - layoutBefore.left;
      reorder.originY += layoutAfter.top - layoutBefore.top;
      if (reorder.lastX != null) {
        card.style.transform = "translate(" + (reorder.lastX - reorder.originX).toFixed(1) + "px," + (reorder.lastY - reorder.originY).toFixed(1) + "px) scale(1.03)";
      }
      cards.forEach(function (el) {
        if (el === card) return;
        const dx = before.get(el).left - el.getBoundingClientRect().left;
        const dy = before.get(el).top - el.getBoundingClientRect().top;
        if (!dx && !dy) return;
        el.style.transition = "none";
        el.style.transform = "translate(" + dx + "px," + dy + "px)";
        requestAnimationFrame(function () {
          el.style.transition = "transform 180ms ease";
          el.style.transform = "";
        });
      });
    }

    function crossed(card, neighbor, dir) {
      const a = card.getBoundingClientRect();
      const b = neighbor.getBoundingClientRect();
      const cy = a.top + a.height / 2;
      const ny = b.top + b.height / 2;
      return dir < 0 ? cy < ny : cy > ny;
    }

    function finishReorder(commitOrder) {
      if (!reorder) return;
      clearTimeout(reorder.timer);
      const card = reorder.card;
      const moved = reorder.moved;
      card.classList.remove("is-dragging");
      card.style.transform = "";
      rowsEl.classList.remove("is-reordering");
      let order = null;
      if (commitOrder && moved) {
        order = Array.from(rowsEl.querySelectorAll(".dial-card")).map(function (el) { return el.dataset.key; });
      }
      reorder = null;
      if (!order) return;
      const same = order.every(function (key, index) { return state.cities[index] && key === keyOf(state.cities[index]); });
      if (same) return;
      state.customOrder = true;
      swallowClick();
      state.cities.sort(function (a, b) { return order.indexOf(keyOf(a)) - order.indexOf(keyOf(b)); });
      renderAll();
    }

    function onReorderMove(event) {
      if (!reorder || event.pointerId !== reorder.pointerId) return;
      const dx = event.clientX - reorder.originX;
      const dy = event.clientY - reorder.originY;
      if (!reorder.gesture) {
        if (Math.hypot(dx, dy) < 8) return;
        reorder.gesture = Math.abs(dx) > Math.abs(dy) + 2 && dx < 0 ? "swipe" : "reorder";
        if (reorder.gesture === "swipe") {
          clearTimeout(reorder.timer);
          reorder.armed = false;
        }
      }
      if (reorder.gesture === "swipe") {
        const face = reorder.card.querySelector(".row-face");
        const actions = reorder.card.querySelector(".row-confirm");
        if (actions) actions.hidden = false;
        if (face) {
          const shift = Math.max(-148, Math.min(0, dx));
          face.style.transform = "translateX(" + shift.toFixed(0) + "px)";
        }
        return;
      }
      if (!reorder.armed) {
        if (Math.hypot(dx, dy) > 12) finishReorder(false);
        return;
      }
      if (!reorder.moved) {
        if (Math.hypot(dx, dy) < 6) return;
        reorder.moved = true;
        reorder.card.classList.add("is-dragging");
        rowsEl.classList.add("is-reordering");
      }
      reorder.card.style.transform = "translate(" + dx.toFixed(1) + "px," + dy.toFixed(1) + "px) scale(1.03)";
      reorder.lastX = event.clientX;
      reorder.lastY = event.clientY;
      const card = reorder.card;
      const prev = card.previousElementSibling;
      const next = card.nextElementSibling;
      if (prev && prev.classList.contains("dial-card") && crossed(card, prev, -1)) shiftLayout(card, -1);
      else if (next && next.classList.contains("dial-card") && crossed(card, next, 1)) shiftLayout(card, 1);

    function onReorderEnd(event) {

      if (reorder.gesture === "swipe") {

        const face = card.querySelector(".row-face");

        swallowClick();

        else {
          card.classList.remove("is-swiped");

      const held = reorder.pointerType !== "mouse" && reorder.armed && !reorder.moved && event.type !== "pointercancel";
      const card = reorder.card;
      finishReorder(event.type !== "pointercancel");
      if (moved) swallowClick();
      if (held) {
        swallowClick();
        openCardMenu(card);
      }
    }

    function addCity(city) {
      const key = keyOf(city);
      const place = { city: city.city, region: city.region, zone: city.zone };
      if (typeof city.lat === "number" && typeof city.lon === "number") {
        place.lat = city.lat;
        place.lon = city.lon;
      }
      if (state.replaceKey) {
        const index = state.cities.findIndex(function (item) { return keyOf(item) === state.replaceKey; });
        if (index < 0) return;
        if (state.cities.some(function (item, itemIndex) { return itemIndex !== index && keyOf(item) === key; })) {
          searchInput.value = "";
          closeList();
          return;
        }
        state.customOrder = true;
        const instant = currentInstant();
        const wasAnchor = state.anchorKey === state.replaceKey;
        state.cities[index] = place;
        if (wasAnchor) {
          state.anchorKey = key;
          const parts = partsInZone(instant, place.zone);
          state.year = parts.year;
          state.month = parts.month;
          state.day = parts.day;
          state.minutes = parts.hour * 60 + parts.minute;
        }
        closeComposer();
        renderAll();
        return;
      }
      if (state.cities.some(function (item) { return keyOf(item) === key; })) {
        searchInput.value = "";
        closeList();
        renderChips();
        return;
      }
      if (state.cities.length >= 8) return;
      state.customOrder = true;
      state.cities.push(place);
      closeComposer();
      renderAll();
    }

    function removeCity(key) {

    function noteVisit(area) {
      try {
        if (navigator.webdriver) return;
        var key = "fwd-audience";
        var now = new Date();
        var day = now.getFullYear() + "-"
          + String(now.getMonth() + 1).padStart(2, "0") + "-"
          + String(now.getDate()).padStart(2, "0");
        var store = {};
        try { store = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (err) { store = {}; }
        if (!store.id || !/^[A-Za-z0-9_-]{8,64}$/.test(store.id)) {
          store.id = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
        }
        if (store[area] === day) return;
        var url = "https://api.forwardslashdot.com/api/hit?area=" + encodeURIComponent(area)
          + "&actor=human&visitor=" + encodeURIComponent(store.id)
          + "&day=" + day;
        fetch(url, { mode: "cors", credentials: "omit", cache: "no-store" }).then(function (res) {
          if (!res.ok) return;
          store[area] = day;
          localStorage.setItem(key, JSON.stringify(store));
        }).catch(function () {});
        var pending = { id: store.id };
        Object.keys(store).forEach(function (name) {
          if (name !== "id" && name !== area) pending[name] = store[name];
        });
        localStorage.setItem(key, JSON.stringify(pending));
      } catch (err) {}
    }

    (function wireDirectClock() {
