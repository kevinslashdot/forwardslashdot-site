  <style>
    /* Apple-style tokens. Light and dark follow the system. */
    :root {
      color-scheme: light dark;
      --bg: #f2f2f7;
      --card: #ffffff;
      --label: #1d1d1f;
      --label2: #6e6e73;
      --label3: #aeaeb2;
      --sep: rgba(60, 60, 67, 0.14);
      --fill: rgba(120, 120, 128, 0.12);
      --fill2: rgba(120, 120, 128, 0.2);
      --blue: #007aff;
      --green: #34c759;
      --green-ink: #1c7c36;
      --orange: #ff9500;
      --red: #ff3b30;
      --p-work: #34c759;
      --p-edge: rgba(255, 149, 0, 0.5);
      --p-night: rgba(120, 120, 128, 0.16);
      --glass: rgba(242, 242, 247, 0.78);
      --shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.04), 0 8px 30px rgba(0, 0, 0, 0.06);
      --font: -apple-system, "SF Pro Display", "SF Pro Text", BlinkMacSystemFont, "Helvetica Neue", Helvetica, Arial, sans-serif;
      --r: 20px;
      --spring: cubic-bezier(0.32, 0.72, 0, 1);
      --inset: 16px;
      --reveal: 148px;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --card: #1c1c1e;
        --label: #f5f5f7;
        --label2: #98989d;
        --label3: #636366;
        --sep: rgba(84, 84, 88, 0.6);
        --fill: rgba(120, 120, 128, 0.24);
        --fill2: rgba(120, 120, 128, 0.36);
        --blue: #0a84ff;
        --green: #30d158;
        --green-ink: #30d158;
        --orange: #ff9f0a;
        --red: #ff453a;
        --p-work: #30d158;
        --p-edge: rgba(255, 159, 10, 0.55);
        --p-night: rgba(120, 120, 128, 0.24);
        --glass: rgba(0, 0, 0, 0.72);
        --shadow: 0 0 0 0.5px rgba(255, 255, 255, 0.07);
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      min-height: 100vh;
      background: var(--bg);
      color: var(--label);
      font-family: var(--font);
      font-size: 17px;
      line-height: 1.3;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: var(--blue); text-decoration: none; }
    :focus-visible { outline: 3px solid color-mix(in srgb, var(--blue) 45%, transparent); outline-offset: 2px; }

    .sr {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 40px; }

    /* ---------- Header ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 52px;
      margin: 0 -16px;
      padding: 0 16px;
      background: var(--glass);
      -webkit-backdrop-filter: saturate(180%) blur(28px);
      backdrop-filter: saturate(180%) blur(28px);
    }

    .brand { display: inline-flex; align-items: baseline; gap: 8px; color: var(--label); }
    .mark { font-size: 20px; font-weight: 700; letter-spacing: -0.04em; }
    .brand-name { font-size: 17px; font-weight: 600; letter-spacing: -0.02em; color: var(--label2); }

    .share {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      background: var(--fill);
      font-size: 15px;
      font-weight: 590;
      color: var(--blue);
      white-space: nowrap;
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .share:active { transform: scale(0.96); background: var(--fill2); }
    .share-glyph { width: 18px; height: 18px; }
    .share.is-copied { color: var(--green-ink); }

    /* ---------- Hero ---------- */
    .moment { padding: 8px 4px 20px; }

    .moment-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
    .date-nav { display: inline-flex; align-items: center; gap: 2px; margin-left: -10px; }
    .moment-actions { display: flex; align-items: center; gap: 4px; }

    .icon-btn {
      width: 44px;
      height: 44px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: none;
      color: var(--blue);
    }
    .icon-btn:active { background: var(--fill2); }
    .icon-btn svg { width: 18px; height: 18px; }

    .date-face {
      position: relative;
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      padding: 0 6px;
      font-size: 15px;
      font-weight: 590;
      letter-spacing: -0.01em;
      color: var(--label2);
      cursor: pointer;
    }
    .date-face input { position: absolute; inset: 0; width: 100%; opacity: 0; cursor: pointer; }

    .where-wrap { position: relative; }
    .where {
      min-height: 44px;
      padding: 0 8px;
      border: 0;
      background: none;
      font-size: 15px;
      font-weight: 590;
      color: var(--blue);
      white-space: nowrap;
    }
    .where span { color: var(--label2); font-weight: 500; }
    .where::after {
      content: "";
      display: inline-block;
      width: 6px;
      height: 6px;
      margin: 0 0 3px 7px;
      border-right: 1.5px solid currentColor;
      border-bottom: 1.5px solid currentColor;
      transform: rotate(45deg);
      opacity: 0.6;
    }

    .text-btn {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      background: var(--fill);
      font-size: 15px;
      font-weight: 590;
      color: var(--blue);
      transition: transform 0.2s var(--spring), background 0.2s;
    }
    .text-btn:active { transform: scale(0.96); background: var(--fill2); }
    .text-btn[aria-pressed="true"] { color: var(--label2); }

    .clock {
      margin-top: 6px;
      font-size: clamp(64px, 20vw, 88px);
      font-weight: 600;
      letter-spacing: -0.045em;
      line-height: 1;
    }
    .ampm { margin-left: 6px; font-size: 0.3em; font-weight: 600; letter-spacing: -0.01em; color: var(--label2); }

    .ask { margin-top: 8px; font-size: 17px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.3; }
    .answer { margin-top: 2px; font-size: 15px; color: var(--label2); line-height: 1.4; }
    .chat-bit { white-space: nowrap; }
    .chat-line {
      position: absolute;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0 0 0 0);
      white-space: nowrap;
    }

    .summary { margin-top: 8px; font-size: 15px; font-weight: 590; color: var(--green-ink); }
    .card-open-row { display: none; }
    .card-open { font-size: 15px; font-weight: 590; }

    /* ---------- Best window ---------- */
    .best {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 12px;
      margin: 0 0 16px;
      padding: 14px 16px;
      border: 0;
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--shadow);
      text-align: left;
      font-size: 17px;
      font-weight: 590;
      letter-spacing: -0.015em;
      line-height: 1.3;
      transition: transform 0.2s var(--spring);
    }
    .best:active { transform: scale(0.99); }
    .best::before {
      content: "";
      flex: none;
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--green);
    }
    .best::after {
      content: "Go there";
      flex: none;
      margin-left: auto;
      padding: 7px 14px;
      border-radius: 18px;
      background: var(--blue);
      color: #fff;
      font-size: 15px;
      white-space: nowrap;
    }
    .meet-note { margin: 0 4px 16px; font-size: 15px; color: var(--label2); }

    /* ---------- The day: shared axis, rows, playhead ---------- */
    .group {
      position: relative;
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--shadow);
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    .scrub {
      position: relative;
      height: 40px;
      padding: 0 var(--inset);
      cursor: ew-resize;
      touch-action: none;
      border-radius: var(--r) var(--r) 0 0;
    }
    .axis-lane { position: relative; height: 100%; }
    .axis-lane span {
      position: absolute;
      top: 10px;
      transform: translateX(-50%);
      font-size: 11px;
      font-weight: 590;
      color: var(--label2);
      white-space: nowrap;
    }
    .axis-lane span:first-child { transform: none; }
    .axis-lane span:nth-child(5) { transform: translateX(-100%); }
    .scrub-pearl {
      position: absolute;
      z-index: 4;
      top: 26px;
      left: calc(var(--f, 0) * 100%);
      width: 20px;
      height: 20px;
      margin-left: -10px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 2px 8px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s var(--spring);
      pointer-events: none;
    }
    body.is-scrubbing .scrub-pearl { transform: scale(1.25); }
    body.is-scrubbing { user-select: none; -webkit-user-select: none; }

    .track { position: relative; }
    .dials { position: relative; }

    /* The playhead passes behind text; a card-coloured halo keeps numerals clean. */
    .head {
      position: absolute;
      z-index: 1;
      top: -6px;
      bottom: 0;
      left: calc(var(--inset) + (100% - 2 * var(--inset)) * var(--f, 0));
      width: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .head::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 14px;
      width: 2px;
      margin-left: -1px;
      border-radius: 1px;
      background: var(--blue);
    }
    .track:has(.is-swiped, .is-dragging, .row-face[style*="translate"]) .head { opacity: 0; }

    .dial-card {
      position: relative;
      overflow: hidden;
      border-top: 0.5px solid var(--sep);
      background: var(--card);
      touch-action: pan-y;
      cursor: grab;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }
    .dial-card.is-dragging {
      z-index: 6;
      cursor: grabbing;
      touch-action: none;
      border-radius: 16px;
      box-shadow: 0 0 0 0.5px rgba(0, 0, 0, 0.08), 0 16px 44px rgba(0, 0, 0, 0.22);
    }
    .dials.is-reordering { overflow: visible; }
    .group.is-full .dial-card:last-child { border-radius: 0 0 var(--r) var(--r); }

    .row-confirm {
      position: absolute;
      inset: 0 0 0 auto;
      display: flex;
    }
    .row-confirm button {
      width: calc(var(--reveal) / 2);
      border: 0;
      border-radius: 0;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
    }
    .row-confirm [data-action="change"] { background: var(--blue); }
    .row-confirm [data-action="remove"] { background: var(--red); }
    .row-confirm button:disabled { opacity: 0.4; }

    .row-face {
      position: relative;
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto;
      column-gap: 8px;
      align-items: center;
      padding: 12px var(--inset) 0;
      transition: transform 0.4s var(--spring);
    }
    .row-face[style*="translate"] { background: var(--card); transition: none; }
    .dial-card.is-swiped .row-face { background: var(--card); transform: translateX(calc(var(--reveal) * -1)); }

    .who { min-width: 0; position: relative; z-index: 2; }
    .city-name {
      display: block;
      max-width: 100%;
      padding: 0;
      border: 0;
      background: none;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.02em;
      text-align: left;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .dial-card.is-home .city-name::after {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-left: 8px;
      border-radius: 50%;
      background: var(--blue);
      vertical-align: 3px;
    }
    .who-meta, .when {
      display: inline;
      font-size: 13px;
      color: var(--label2);
    }
    .sub { margin-top: 1px; font-size: 13px; color: var(--label2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .when { margin-left: 6px; font-weight: 590; color: var(--blue); }

    .who-time {
      position: relative;
      z-index: 2;
      font-size: 30px;
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.05;
      text-align: right;
      white-space: nowrap;
    }
    .who-time small { margin-left: 4px; font-size: 12px; font-weight: 600; letter-spacing: 0.02em; color: var(--label2); }
    .wday { display: none; }

    .city-name, .who-time, .sub {
      text-shadow: 0 0 3px var(--card), 0 0 3px var(--card), 0 0 6px var(--card), 0 0 8px var(--card), 0 0 10px var(--card);
    }

    .row-more {
      position: relative;
      z-index: 2;
      width: 32px;
      height: 32px;
      display: inline-grid;
      place-items: center;
      border: 0;
      border-radius: 50%;
      background: var(--fill);
      color: var(--label2);
    }
    .row-more:hover, .row-more[aria-expanded="true"] { color: var(--label); background: var(--fill2); }
    .row-more svg { width: 16px; height: 16px; }

    .band-hit { grid-column: 1 / -1; padding: 12px 0 14px; cursor: ew-resize; touch-action: pan-y; }
    .dayband { position: relative; height: 8px; border-radius: 4px; background: var(--strip, var(--p-night)); }

    .add-row {
      display: flex;
      width: 100%;
      align-items: center;
      gap: 10px;
      min-height: 52px;
      padding: 0 var(--inset);
      border: 0;
      border-top: 0.5px solid var(--sep);
      border-radius: 0 0 var(--r) var(--r);
      background: none;
      font-size: 17px;
      font-weight: 500;
      color: var(--blue);
      text-align: left;
    }
    .add-row:active { background: var(--fill); }
    .add-row .plus { width: 22px; height: 22px; display: inline-grid; place-items: center; border-radius: 50%; background: var(--blue); color: #fff; }
    .add-row .plus svg { width: 12px; height: 12px; }

    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 14px 6px 0; font-size: 13px; color: var(--label2); }
    .legend i { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 3px; vertical-align: -1px; }
    .tip { padding: 10px 6px 0; font-size: 13px; color: var(--label2); }

    /* ---------- Add / change a place ---------- */
    .adder {
      display: none;
      margin-top: 16px;
      padding: 14px 16px 16px;
      border-radius: var(--r);
      background: var(--card);
      box-shadow: var(--shadow);
    }
    .adder.is-open { display: block; }
    .adder-title { margin-bottom: 10px; font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
    .search { position: relative; }
    .search input {
      width: 100%;
      height: 44px;
      padding: 0 14px;
      border: 0;
      border-radius: 12px;
      background: var(--fill);
      font-size: 17px;
      outline: none;
    }
    .search input::placeholder { color: var(--label2); }
    .search input:focus-visible { box-shadow: 0 0 0 3px color-mix(in srgb, var(--blue) 40%, transparent); }
    .search input:disabled { opacity: 0.5; }
    .results { list-style: none; margin-top: 6px; max-height: 340px; overflow: auto; }
    .option {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      min-height: 56px;
      padding: 0 4px;
      border-top: 0.5px solid var(--sep);
      cursor: pointer;
    }
    .option:first-child { border-top: 0; }
    .option[aria-selected="true"] { background: var(--fill); border-radius: 10px; }
    .opt-city { font-weight: 590; }
    .opt-meta { font-size: 13px; color: var(--label2); text-align: right; }
    .no-match { padding: 18px 4px; color: var(--label2); text-align: center; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
    .chip {
      min-height: 36px;
      padding: 0 14px;
      border: 0;
      border-radius: 18px;
      background: var(--fill);
      font-size: 15px;
      font-weight: 590;
    }
    .chip:active { background: var(--fill2); }

    /* ---------- Workday ---------- */
    .workday { margin-top: 16px; border-radius: var(--r); background: var(--card); box-shadow: var(--shadow); }
    .workday summary {
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 52px;
      padding: 0 16px;
      font-size: 17px;
      list-style: none;
      cursor: pointer;
    }
    .workday summary::-webkit-details-marker { display: none; }
    .workday summary::after {

      width: 8px;
      height: 8px;
      margin-left: 12px;
      border-right: 2px solid var(--label3);
      border-bottom: 2px solid var(--label3);

      transition: transform 0.3s var(--spring);

    .workday[open] summary::after { transform: rotate(-135deg); }
    .workday-body {

      align-items: center;
      flex-wrap: wrap;
      gap: 10px 12px;

      padding: 0 10px;
      border: 0;
      border-radius: 10px;

      font-size: 15px;

    .segmented { display: inline-flex; padding: 2px; border-radius: 10px; background: var(--fill); }
    .dur {
      min-height: 32px;
      min-width: 52px;
      padding: 0 12px;
      border: 0;
      border-radius: 8px;
      background: none;
      font-size: 13px;
      font-weight: 590;
      color: var(--label);

    .work-note { flex-basis: 100%; font-size: 13px; color: var(--red); }

    /* ---------- Menus and toast ---------- */
    .home-menu, .row-menu {
      min-width: 220px;
      padding: 6px;
      border-radius: 16px;
      background: var(--glass);
      -webkit-backdrop-filter: saturate(180%) blur(30px);
      backdrop-filter: saturate(180%) blur(30px);

      animation: pop 0.22s var(--spring);

    @keyframes pop { from { opacity: 0; transform: scale(0.94); } }
    .home-menu { position: absolute; z-index: 40; top: 100%; right: 0; list-style: none; transform-origin: top right; }
    .home-menu button, .row-menu button {

  <script>

      cities: [],
      anchorKey: "",
      year: 2026,
      month: 1,
      day: 1,
      minutes: 9 * 60,
      workStart: 9 * 60,
      workEnd: 17 * 60,
      duration: 60,
      detected: "",
      followDevice: true,
      customOrder: false,
      replaceKey: ""
    };

    const board = document.getElementById("board");
    const rowsEl = document.getElementById("rows");
    const slider = document.getElementById("slider");
    const groupEl = document.getElementById("group");

    let activeOption = 0;
    let reorder = null;
    let suppressClick = false;
    let swallowTimer = 0;

    // A drag can be followed by a click on release. Eat that one, but never a later tap.
    function swallowClick() {

    function keyOf(city) { return city.city + "~" + city.zone; }

    function safeZone(zone) {
      try {

    function zoneLabel(zone) {

    // British Columbia's last clock change was the spring-forward on
    // 8 March 2026. After 02:00 PST (10:00 UTC) the province stays on
    // Pacific Time, UTC−7, abbreviated PCT. Older browser timezone data
    // still falls back to PST in November or keeps the PDT label.
    const BC_PCT_ZONES = { "America/Vancouver": true, "Canada/Pacific": true };
    const BC_PCT_FROM = Date.UTC(2026, 2, 8, 10, 0);

    function permanentRule(zone, utcMs) {
      if (BC_PCT_ZONES[zone] && utcMs >= BC_PCT_FROM) return { offset: -420, abbr: "PCT" };

    }

    function partsFromOffset(utcMs, offset, abbr) {
      const date = new Date(utcMs + offset * 60000);
      const weekdays = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
      return {
        year: date.getUTCFullYear(),
        month: date.getUTCMonth() + 1,
        day: date.getUTCDate(),
        hour: date.getUTCHours(),
        minute: date.getUTCMinutes(),
        second: date.getUTCSeconds(),
        weekday: weekdays[date.getUTCDay()],
        abbr: abbr
      };
    }

    function partsInZone(utcMs, timeZone) {
      const fixed = permanentRule(timeZone, utcMs);
      if (fixed) return partsFromOffset(utcMs, fixed.offset, fixed.abbr);
      const fmt = new Intl.DateTimeFormat("en-US", {
        timeZone: timeZone,
        hourCycle: "h23",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        weekday: "long",
        timeZoneName: "short"
      });
      const bag = {};
      fmt.formatToParts(new Date(utcMs)).forEach(function (part) { bag[part.type] = part.value; });
      let hour = Number(bag.hour);
      if (hour === 24) hour = 0;
      return {
        year: Number(bag.year),
        month: Number(bag.month),
        day: Number(bag.day),
        hour: hour,
        minute: Number(bag.minute),
        second: Number(bag.second),
        weekday: bag.weekday,
        abbr: bag.timeZoneName || ""
      };
    }

    function tzOffset(utcMs, timeZone) {
      const fixed = permanentRule(timeZone, utcMs);
      if (fixed) return fixed.offset;
      const parts = partsInZone(utcMs, timeZone);
      const asUTC = Date.UTC(parts.year, parts.month - 1, parts.day, parts.hour, parts.minute, parts.second);
      return Math.round((asUTC - utcMs) / 60000);
    }

    function civilToInstant(year, month, day, minutes, timeZone) {
      const hour = Math.floor(minutes / 60);
      const minute = minutes % 60;
      const utc = Date.UTC(year, month - 1, day, hour, minute);
      const offset = tzOffset(utc, timeZone);
      let instant = utc - offset * 60000;
      const offset2 = tzOffset(instant, timeZone);
      if (offset2 !== offset) instant = utc - offset2 * 60000;
      return instant;
    }

    function covers(minute, start, end) {
      if (end <= start || end - start >= 1440) return end - start >= 1440;
      if (minute < start) minute += 1440;
      else if (minute >= start + 1440) minute -= 1440;
      return start <= minute && minute < end;
    }

    function classify(minute) {
      minute = ((minute % 1440) + 1440) % 1440;
      if (covers(minute, state.workStart, state.workEnd)) return "work";
      if (covers(minute, state.workStart - 120, state.workStart)) return "early";
      if (covers(minute, state.workEnd, state.workEnd + 120)) return "late";
      return "night";

      const suffix = hour < 12 ? "AM" : "PM";

      const mins = minutes % 60;

    function dayDelta(from, to) {
      const a = Date.UTC(from.year, from.month - 1, from.day);
      const b = Date.UTC(to.year, to.month - 1, to.day);
      return Math.round((b - a) / 86400000);

      if (delta === -1) return "yesterday";
      if (delta === 0) return "same";

      if (delta === 0) return parts.weekday;
      if (delta === 1) return "Tomorrow";

    function summaryLine(places) {

    function fitSummary() {
      const el = document.getElementById("summary");
      if (!el || !el.clientWidth) return;
      el.style.fontSize = "";
      el.style.whiteSpace = "nowrap";
      let size = 1.02;
      while (el.scrollWidth > el.clientWidth + 1 && size > 0.9) {
        size = Math.round((size - 0.015) * 1000) / 1000;
        el.style.fontSize = size + "rem";
      }
      if (el.scrollWidth > el.clientWidth + 1) {

        el.style.fontSize = "";
      }
    }

    function anchorCity() {
      return state.cities.find(function (city) { return keyOf(city) === state.anchorKey; }) || state.cities[0];
    }

    function currentInstant() {
      const anchor = anchorCity();
      return civilToInstant(state.year, state.month, state.day, state.minutes, anchor.zone);

    function snapshot() {
      const instant = currentInstant();
      const anchor = anchorCity();
      const anchorParts = partsInZone(instant, anchor.zone);
      const anchorOffset = tzOffset(instant, anchor.zone);

          city: city,
          parts: parts,

    function holds(instant, duration, zone) {
      const seen = [];
      for (let step = 0; step < duration; step += 15) {
        const parts = partsInZone(instant + step * 60000, zone);
        seen.push(classify(parts.hour * 60 + parts.minute));
      }
      if (seen.every(function (item) { return item === "work"; })) return "work";
      if (seen.every(function (item) { return item === "work" || item === "early"; })) return "early";
      if (seen.every(function (item) { return item === "work" || item === "late"; })) return "late";

    function findWindows() {
      const anchor = anchorCity();
      const duration = state.duration;
      const candidates = [];
      for (let start = 0; start + duration <= 1440; start += 30) {
        const instant = civilToInstant(state.year, state.month, state.day, start, anchor.zone);
        const check = partsInZone(instant, anchor.zone);
        if (check.year !== state.year || check.month !== state.month || check.day !== state.day) continue;
        if (check.hour * 60 + check.minute !== start) continue;
        const held = state.cities.map(function (city) { return holds(instant, duration, city.zone); });
        const workCount = held.filter(function (item) { return item === "work"; }).length;
        const score = held.reduce(function (sum, item) {
          return sum + (item === "work" ? 2 : item === "night" ? 0 : 1);
        }, 0);
        candidates.push({ start: start, instant: instant, held: held, score: score, all: workCount === state.cities.length });
      }
      if (!candidates.length) return [];
      let pool = candidates.filter(function (item) { return item.all; });
      if (!pool.length) {
        const best = Math.max.apply(null, candidates.map(function (item) { return item.score; }));
        pool = candidates.filter(function (item) { return item.score === best; });
      }
      pool.sort(function (a, b) { return a.start - b.start; });
      const chosen = [];
      pool.forEach(function (item) {
        if (chosen.length >= 4) return;
        if (chosen.some(function (prev) { return Math.abs(item.start - prev.start) < duration; })) return;
        chosen.push(item);
      });
      return chosen;
    }

    function segmentPeriod(city, hour) {
      const instant = civilToInstant(state.year, state.month, state.day, hour * 60 + 30, anchorCity().zone);
      const parts = partsInZone(instant, city.zone);
      return classify(parts.hour * 60 + parts.minute);
    }

    function paint() {
      const snap = snapshot();
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute);
      document.getElementById("clock-hm").textContent = time.h + ":" + time.m;
      document.getElementById("clock-ampm").textContent = time.suffix;

      const dateCore = noon.weekday + ", " + MONTHS[state.month - 1] + " " + state.day;
      document.getElementById("date-text").textContent = state.year === live.year ? dateCore : dateCore + ", " + state.year;
      document.getElementById("date-input").value = stampDate();
      const atNow = sameDay(live, state) && state.minutes === live.hour * 60 + live.minute;
      document.getElementById("now").setAttribute("aria-pressed", atNow ? "true" : "false");

      const summary = summaryLine(snap.places);
      const summaryEl = document.getElementById("summary");
      summaryEl.hidden = !summary;
      summaryEl.textContent = summary;
      if (summary) fitSummary();
      const line = fillChatLine(snap);
      const question = fillAsk(snap);

      groupEl.style.setProperty("--f", (state.minutes / 1440).toFixed(5));
      slider.setAttribute("aria-valuenow", String(state.minutes));
      slider.setAttribute("aria-valuetext", line);
      document.title = question;
      const open = document.getElementById("card-open");
      if (open) {
        const bare = new URL(location.href);
        bare.searchParams.delete("embed");
        bare.searchParams.delete("card");
        bare.searchParams.delete("format");
        open.href = bare.pathname + bare.search;
      }

      snap.places.forEach(function (place) {
        const row = rowsEl.querySelector('[data-key="' + CSS.escape(keyOf(place.city)) + '"]');
        if (!row) return;
        const clock = formatTime(place.parts.hour, place.parts.minute);
        const hm = row.querySelector("[data-time]");
        hm.textContent = clock.h + ":" + clock.m;
        const suffix = document.createElement("small");
        suffix.textContent = clock.suffix;
        hm.append(suffix);
        const wday = row.querySelector("[data-wday]");
        if (place.delta === 0) {
          wday.hidden = true;
          wday.textContent = "";
        } else {
          wday.hidden = false;
          wday.textContent = place.parts.weekday.slice(0, 3);
        }
        const yours = place.city.zone === state.detected;
        let metaText = (yours ? "Your location" : place.offsetLabel) + " · " + place.parts.abbr;
        if (BC_PCT_ZONES[place.city.zone]) {
          metaText = (yours ? "" : place.offsetLabel + " · ") + "UTC−7 all year";
        }
        const metaEl = row.querySelector("[data-meta]");
        metaEl.textContent = metaText;
        metaEl.title = BC_PCT_ZONES[place.city.zone]
          ? "British Columbia stays on Pacific Time (PCT, UTC−7) all year."
          : metaText;
        const when = row.querySelector("[data-when]");
        when.textContent = place.delta === 0 ? "" : dayText(place.delta, place.parts);
        when.hidden = place.delta === 0;
        row.classList.toggle("is-home", keyOf(place.city) === state.anchorKey);
      });

      const best = document.getElementById("best");
      const start = Number(best.dataset.start);
      if (Number.isFinite(start)) {
        const inside = state.minutes >= start && state.minutes < start + state.duration;
        const already = snap.places.every(function (place) { return place.period === "work"; });
        best.hidden = inside || already;
        best.setAttribute("aria-pressed", inside && !already ? "true" : "false");
      }
      const workOpen = formatTime(Math.floor(state.workStart / 60), state.workStart % 60).text;
      const workClose = formatTime(Math.floor(state.workEnd / 60) % 24, state.workEnd % 60).text;
      const lengthLabel = state.duration === 30 ? "30 min" : state.duration === 120 ? "2 hours" : "1 hour";
      document.getElementById("workday-summary").textContent = "Workday " + workOpen + " – " + workClose + " · " + lengthLabel;
    }

    function sameDay(parts, clock) {
      return parts.year === clock.year && parts.month === clock.month && parts.day === clock.day;
    }

    function orderedPlaces(snap) {
      const home = [];
      const rest = [];
      snap.places.forEach(function (place) {
        if (keyOf(place.city) === state.anchorKey) home.push(place);
        else rest.push(place);
      });
      return home.concat(rest);
    }

    function placeLine(place) {
      const time = formatTime(place.parts.hour, place.parts.minute).text;
      const extra = place.delta === 0 ? "" : " " + dayText(place.delta, place.parts).toLowerCase();
      return time + " " + place.city.city + extra;
    }

    function fillAsk(snap) {
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute).text;
      const question = "What time is " + time + " in " + snap.anchor.city + "?";
      document.getElementById("ask").textContent = question;
      const answer = document.getElementById("answer");
      const others = orderedPlaces(snap).filter(function (place) {
        return keyOf(place.city) !== state.anchorKey;
      });
      answer.replaceChildren();
      if (!others.length) {
        answer.textContent = snap.anchorParts.weekday + ", " + MONTHS[snap.anchorParts.month - 1] + " " + snap.anchorParts.day;
      } else {
        others.forEach(function (place, index) {
          if (index) answer.append(document.createTextNode(" \u00b7 "));
          const bit = document.createElement("span");
          bit.className = "chat-bit";
          const clock = formatTime(place.parts.hour, place.parts.minute).text;
          const extra = place.delta === 0 ? "" : dayText(place.delta, place.parts).toLowerCase() + " ";
          bit.textContent = clock + " " + extra + "in " + place.city.city;
          answer.append(bit);
        });
      }
      const bits = others.map(function (place) {
        const clock = formatTime(place.parts.hour, place.parts.minute).text;
        const extra = place.delta === 0 ? "" : dayText(place.delta, place.parts).toLowerCase() + " ";
        return clock + " " + extra + "in " + place.city.city;
      });
      let sentence = time + " in " + snap.anchor.city + ".";
      if (bits.length === 1) sentence = time + " in " + snap.anchor.city + " is " + bits[0] + ".";
      else if (bits.length > 1) sentence = time + " in " + snap.anchor.city + " is " + bits.slice(0, -1).join(", ") + " and " + bits[bits.length - 1] + ".";
      const desc = document.querySelector('meta[name="description"]');
      if (desc) desc.setAttribute("content", sentence);
      return question;
    }

    function fillChatLine(snap) {
      const el = document.getElementById("chat-line");
      const ordered = orderedPlaces(snap);
      el.replaceChildren();
      ordered.forEach(function (place, index) {
        if (index) el.append(document.createTextNode(" \u00b7 "));
        const bit = document.createElement("span");
        bit.className = "chat-bit";
        bit.textContent = placeLine(place);
        el.append(bit);
      });
      return el.textContent;
    }

    // Each strip shows what the shared day looks like in that city, half an hour at a time.
    function paintBand(el, city, instants) {
      if (!el) return;
      const tone = { work: "var(--p-work)", early: "var(--p-edge)", late: "var(--p-edge)", night: "var(--p-night)" };
      const runs = [];
      instants.forEach(function (instant, slot) {
        const local = partsInZone(instant, city.zone);
        const color = tone[classify(local.hour * 60 + local.minute)];
        const last = runs[runs.length - 1];
        if (last && last.color === color) last.to = slot + 1;
        else runs.push({ color: color, from: slot, to: slot + 1 });
      });
      const stops = runs.map(function (run) {
        return run.color + " " + (run.from / 48 * 100).toFixed(3) + "% " + (run.to / 48 * 100).toFixed(3) + "%";
      });
      el.style.setProperty("--strip", "linear-gradient(to right, " + stops.join(", ") + ")");
      const open = formatTime(Math.floor(state.workStart / 60), state.workStart % 60).text;
      const close = formatTime(Math.floor(state.workEnd / 60) % 24, state.workEnd % 60).text;
      el.parentNode.title = "Workday " + open + " to " + close + " in " + city.city + ". Drag to pick a time.";
      el.setAttribute("aria-hidden", "true");
    }

    function renderTicks() {}

    function renderRows() {
      closeRowMenu();
      rowsEl.innerHTML = "";
      const anchor = anchorCity();
      const instants = [];
      for (let slot = 0; slot < 48; slot += 1) {
        instants.push(civilToInstant(state.year, state.month, state.day, slot * 30 + 15, anchor.zone));
      }
      const finePointer = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
      state.cities.forEach(function (city) {
        const home = keyOf(city) === state.anchorKey;
        const card = document.createElement("article");
        card.className = "dial-card " + (home ? "is-home" : "is-chip");
        card.dataset.key = keyOf(city);

        const name = document.createElement("button");
        name.type = "button";
        name.className = "city-name";
        name.dataset.anchor = keyOf(city);
        name.textContent = city.city;
        name.setAttribute("aria-pressed", home ? "true" : "false");
        name.title = "Show the day in " + city.city + " time";
        const sub = document.createElement("p");
        sub.className = "sub";
        const meta = document.createElement("span");
        meta.className = "who-meta";
        meta.dataset.meta = "1";

        when.dataset.when = "1";

        const wday = document.createElement("span");
        wday.className = "wday";
        wday.dataset.wday = "1";

        time.append(hm, wday);

        const more = document.createElement("button");
        more.type = "button";
        more.className = "row-more";
        more.setAttribute("aria-label", "Actions for " + city.city);
        more.setAttribute("aria-haspopup", "menu");
        more.setAttribute("aria-expanded", "false");
        more.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="3.2" cy="8" r="1.15" fill="currentColor"/><circle cx="8" cy="8" r="1.15" fill="currentColor"/><circle cx="12.8" cy="8" r="1.15" fill="currentColor"/></svg>';

        [
          { action: "change", label: "Change" },

        ].forEach(function (item) {
          const choice = document.createElement("button");
          choice.type = "button";
          choice.dataset.action = item.action;
          choice.textContent = item.label;
          choice.tabIndex = -1;
          choice.setAttribute("aria-label", item.label + " " + city.city);
          if (item.disabled) choice.disabled = true;
          confirm.append(choice);
        });

        card.tabIndex = 0;
        card.addEventListener("keydown", function (event) {
          if (event.target !== card) return;
          if (event.key === "Delete" || event.key === "Backspace") {
            event.preventDefault();
            openCardMenu(card, true);
            return;
          }
          const up = event.key === "ArrowLeft" || event.key === "ArrowUp";
          const down = event.key === "ArrowRight" || event.key === "ArrowDown";
          if (!up && !down) return;
          event.preventDefault();
          event.stopPropagation();
          moveCity(card.dataset.key, up ? -1 : 1);
        });
        card.setAttribute("aria-label", city.city + (finePointer
          ? ". Drag to reorder. Press Delete to change or remove."
          : ". Drag to reorder, or swipe left to change or delete."));
        card.append(confirm, face);
        rowsEl.append(card);
      });
      const full = state.cities.length >= 8;
      document.getElementById("add-city").hidden = full;
      document.getElementById("group").classList.toggle("is-full", full);
      document.getElementById("tip").textContent = finePointer
        ? "Drag along a bar to pick a time. Drag a city to reorder it, or use its \u22ef menu to change or delete it."
        : "Drag along a bar to pick a time. Hold and drag a city to reorder it. Swipe it left to change or delete.";
    }

    function renderMeetings() {
      document.querySelectorAll(".dur").forEach(function (button) {
        button.setAttribute("aria-pressed", Number(button.dataset.dur) === state.duration ? "true" : "false");
      });
      const best = document.getElementById("best");
      const note = document.getElementById("meet-note");
      if (state.cities.length < 2) {
        best.hidden = true;
        note.hidden = true;
        return;
      }
      const windows = findWindows();
      const good = windows.find(function (item) { return item.all; });
      if (good) {
        const startText = formatTime(Math.floor(good.start / 60), good.start % 60).text;
        const snap = snapshot();
        const already = snap.places.every(function (place) { return place.period === "work"; });
        const inside = state.minutes >= good.start && state.minutes < good.start + state.duration;
        best.dataset.start = String(good.start);
        best.textContent = startText + " " + anchorCity().city + ", everyone is in their workday";
        best.hidden = already || inside;
        note.hidden = true;
      } else {
        best.hidden = true;
        best.removeAttribute("data-start");
        const length = state.duration === 30 ? "30-minute" : state.duration === 120 ? "2-hour" : "1-hour";
        note.hidden = false;
        note.textContent = "No " + length + " window lands in every workday.";
      }
    }

    function renderChips() {
      chipsEl.innerHTML = "";
      const query = searchInput.value.trim();
      if (query || state.cities.length >= 8) {
        chipsEl.hidden = true;
        return;
      }
      const have = new Set(state.cities.map(function (city) { return city.city; }));
      const picks = SUGGEST.filter(function (name) { return !have.has(name); }).slice(0, 4);
      chipsEl.hidden = picks.length === 0;
      picks.forEach(function (name) {
        const city = CITIES.find(function (item) { return item.city === name; });
        if (!city) return;
        const button = document.createElement("button");
        button.type = "button";
        button.className = "chip";
        button.textContent = name;
        button.addEventListener("click", function () { addCity(city); });
        chipsEl.append(button);
      });
    }

    function syncChrome() {
      const full = state.cities.length >= 8;
      searchInput.disabled = full;
      searchInput.placeholder = full ? "Eight places is enough to compare" : "Add a place";
      document.getElementById("work-start").value = String(Math.floor(state.workStart / 60));
      document.getElementById("work-end").value = String(Math.floor(state.workEnd / 60) === 24 ? 24 : Math.floor(state.workEnd / 60));
    }

    function renderAll() {
      renderTicks();
      renderRows();
      renderMeetings();
      renderChips();
      syncChrome();
      paint();
      commit();
    }

    function commit() {
      syncUrl();
      save();
    }

    function announce() {
      const snap = snapshot();
      const time = formatTime(snap.anchorParts.hour, snap.anchorParts.minute);
      const others = snap.places.filter(function (place) {
        return keyOf(place.city) !== state.anchorKey;
      }).map(placeLine);
      const extra = summaryLine(snap.places);
      let text = time.text + " in " + snap.anchor.city;
      if (others.length) text += ". " + others.join(", ");
      if (extra) text += ". " + extra;
      live.textContent = text + ".";
    }

    function stampDate() {
      return state.year + "-" + String(state.month).padStart(2, "0") + "-" + String(state.day).padStart(2, "0");
    }

    function syncUrl() {
      const params = new URLSearchParams();
      params.set("cities", state.cities.map(linkToken).join(","));
      params.set("anchor", state.anchorKey);
      const hh = String(Math.floor(state.minutes / 60)).padStart(2, "0");
      const mm = String(state.minutes % 60).padStart(2, "0");
      params.set("at", stampDate() + "T" + hh + ":" + mm);
      const ws = String(Math.floor(state.workStart / 60)).padStart(2, "0") + ":" + String(state.workStart % 60).padStart(2, "0");
      const we = String(Math.floor(state.workEnd / 60)).padStart(2, "0") + ":" + String(state.workEnd % 60).padStart(2, "0");
      params.set("work", ws + "-" + we);
      params.set("dur", String(state.duration));
      if (document.body.classList.contains("embed")) {
        const incoming = new URLSearchParams(location.search);
        if (incoming.get("card") === "1") params.set("card", "1");
        else params.set("embed", "1");
      }
      const open = document.getElementById("card-open");
      if (open) {
        const bare = new URLSearchParams(params);
        bare.delete("embed");
        bare.delete("card");
        bare.delete("format");
        open.href = location.pathname + "?" + bare.toString();
      }
      const next = location.pathname + "?" + params.toString();
      if (next !== location.pathname + location.search) history.replaceState(null, "", next);
    }

    function save() {
      try {
        localStorage.setItem(STORAGE, JSON.stringify({
          cities: state.cities,
          anchorKey: state.anchorKey,
          followDevice: state.followDevice === true,
          customOrder: state.customOrder === true,
          workStart: state.workStart,
          workEnd: state.workEnd,
          duration: state.duration
        }));
      } catch (err) { /* private mode */ }
    }

    function parseClock(value) {
      if (!value) return null;
      const bits = value.trim().split(":");
      const hour = Number(bits[0]);
      const minute = bits.length > 1 ? Number(bits[1]) : 0;
      if (!Number.isFinite(hour) || !Number.isFinite(minute)) return null;
      if (hour < 0 || hour > 24 || minute < 0 || minute > 59) return null;
      return hour * 60 + minute;
    }

    function parseWork(spec) {
      const bits = spec.split("-");
      if (bits.length !== 2) return null;
      const start = parseClock(bits[0]);
      const end = parseClock(bits[1]);
      if (start == null || end == null || end <= start || end - start < 30) return null;
      return [start, end];
    }

    function peelCoords(token) {
      const at = token.lastIndexOf("@");
      if (at < 1) return { token: token, lat: null, lon: null };
      const bits = token.slice(at + 1).split("_");
      const lat = Number(bits[0]);
      const lon = Number(bits[1]);
      if (bits.length !== 2 || !isFinite(lat) || !isFinite(lon) || Math.abs(lat) > 90 || Math.abs(lon) > 180) {
        return { token: token, lat: null, lon: null };
      }
      return { token: token.slice(0, at), lat: lat, lon: lon };
    }

    function withCoords(place, peeled) {
      if (!place || peeled.lat == null) return place;
      place.lat = peeled.lat;
      place.lon = peeled.lon;
      return place;
    }

    function linkToken(city) {
      let token = keyOf(city);
      if (typeof city.lat === "number" && typeof city.lon === "number") {
        token += "@" + city.lat.toFixed(2) + "_" + city.lon.toFixed(2);
      }
      return token;
    }

    function parseToken(token) {
      token = token.trim();
      if (!token) return null;
      const peeled = peelCoords(token);
      token = peeled.token;
      if (token.includes("~")) {
        const index = token.indexOf("~");
        const city = token.slice(0, index);
        const zone = token.slice(index + 1);
        if (!safeZone(zone)) return null;
        const known = CITIES.find(function (item) { return item.city === city && item.zone === zone; });
        const place = known
          ? { city: known.city, region: known.region, zone: known.zone }
          : { city: city, region: zoneLabel(zone), zone: zone };
        return withCoords(place, peeled);
      }
      const folded = token.toLowerCase();
      const byCity = CITIES.find(function (item) { return item.city.toLowerCase() === folded; });
      if (byCity) return { city: byCity.city, region: byCity.region, zone: byCity.zone };
      const byAlias = CITIES.find(function (item) {
        return (item.aliases || []).some(function (alias) { return alias.toLowerCase() === folded; });
      });
      if (byAlias) return { city: byAlias.city, region: byAlias.region, zone: byAlias.zone };
      const abbrZones = ABBR_ZONES[folded.replace(/\s+/g, "")];
      if (abbrZones) {
        const matches = CITIES.filter(function (item) { return abbrZones.indexOf(item.zone) !== -1; });
        matches.sort(function (a, b) {
          return (b.popular === true) - (a.popular === true) || a.city.localeCompare(b.city);
        });
        if (matches[0]) return { city: matches[0].city, region: matches[0].region, zone: matches[0].zone };
      }
      if (safeZone(token)) {
        const known = CITIES.find(function (item) { return item.zone === token; });
        return known
          ? { city: known.city, region: known.region, zone: known.zone }
          : { city: zoneLabel(token), region: token, zone: token };
      }
      return null;
    }

    function parseCityList(raw) {
      const bits = raw.split(",");
      const cities = [];
      let index = 0;
      while (index < bits.length && cities.length < 8) {
        const one = bits[index].trim();
        const two = index + 1 < bits.length ? one + ", " + bits[index + 1].trim() : "";
        const pair = two ? parseToken(two) : null;
        if (pair) {
          cities.push(pair);
          index += 2;
          continue;
        }
        const single = parseToken(one);
        if (single) cities.push(single);
        index += 1;
      }
      return cities;
    }

    function parseLooseTime(value) {
      const text = String(value || "").trim().toLowerCase().replace(/\./g, "").replace(/\s+/g, "");
      const match = text.match(/^(\d{1,2})(?::(\d{2}))?(am|pm)?$/);
      if (!match) return null;
      let hour = Number(match[1]);
      const minute = match[2] ? Number(match[2]) : 0;
      if (minute > 59 || hour > 24) return null;
      if (match[3] === "pm" && hour < 12) hour += 12;
      if (match[3] === "am" && hour === 12) hour = 0;
      if (match[3] === "am" && hour > 12) return null;
      if (!match[3] && hour === 24) hour = 0;
      if (!match[3] && hour > 23) return null;
      return hour * 60 + minute;
    }

    let ZONE_SETS = {};

    function cityRecord(name) {
      const row = CITIES.find(function (item) { return item.city === name; });
      if (!row) return null;
      return { city: row.city, region: row.region, zone: row.zone };
    }

    function zoneEntry(zone) {
      const seen = {};
      let current = zone;
      while (current && ZONE_SETS[current] && ZONE_SETS[current].same && !seen[current]) {
        seen[current] = true;
        current = ZONE_SETS[current].same;
      }
      return (current && ZONE_SETS[current]) || null;
    }

    function largestForZone(zone) {
      const entry = zoneEntry(zone);
      if (entry && entry.city) {
        const known = cityRecord(entry.city);
        if (known) return known;
      }
      const rows = CITIES.filter(function (item) { return item.zone === zone; }).sort(byPopular);
      if (rows[0]) return { city: rows[0].city, region: rows[0].region, zone: rows[0].zone };
      let off = null;
      try { off = tzOffset(Date.now(), zone); } catch (err) { off = null; }
      if (off == null) return null;
      const match = CITIES.filter(function (item) {
        try { return tzOffset(Date.now(), item.zone) === off; } catch (err) { return false; }
      }).sort(byPopular);
      if (match[0]) return { city: match[0].city, region: match[0].region, zone: match[0].zone };
      return null;
    }

    function seed(detected) {
      const home = largestForZone(detected) || cityRecord("London");
      const entry = zoneEntry(detected);
      const names = ((entry && entry.compare) || ["New York", "London", "Los Angeles", "Tokyo"]).concat(["New York", "London", "Los Angeles", "Tokyo", "Sydney"]);
      const cities = [];
      if (home) cities.push(home);
      names.forEach(function (name) {
        if (cities.length >= 3) return;
        const city = cityRecord(name) || largestForZone(name);
        if (!city) return;
        if (cities.some(function (item) { return item.city === city.city || item.zone === city.zone; })) return;
        cities.push(city);
      });
      return cities;
    }

    function placeForZone(zone) {
      return parseToken(zone);
    }

    function restore() {
      state.detected = safeZone(Intl.DateTimeFormat().resolvedOptions().timeZone) || "Etc/UTC";
      const params = new URLSearchParams(location.search);
      let cities = [];
      let fromStore = null;
      state.followDevice = true;
      try { fromStore = JSON.parse(localStorage.getItem(STORAGE) || "null"); } catch (err) { fromStore = null; }

    function foldQuery(value) {

    function parseOffsetQuery(raw) {
      let q = foldQuery(raw).replace(/\s+/g, "");
      q = q.replace(/^gmt/, "").replace(/^utc/, "");
      if (!q || (q[0] !== "+" && q[0] !== "-")) return null;
      const sign = q[0] === "+" ? 1 : -1;
      const body = q.slice(1);
      let hours = 0;
      let mins = 0;
      if (/^\d{1,2}$/.test(body)) hours = Number(body);
      else if (/^\d{1,2}:\d{2}$/.test(body)) {
        const bits = body.split(":");
        hours = Number(bits[0]);
        mins = Number(bits[1]);
      } else if (/^\d{1,2}\.\d$/.test(body)) {
        const bits = body.split(".");
        hours = Number(bits[0]);
        mins = Math.round(Number("0." + bits[1]) * 60);
      } else if (/^\d{4}$/.test(body)) {
        hours = Number(body.slice(0, 2));
        mins = Number(body.slice(2));
      } else return null;
      if (hours > 14 || mins > 59) return null;
      return sign * (hours * 60 + mins);

        zones.forEach(function (zone) { wanted[zone] = true; });

      if (offset != null) {
        const now = Date.now();
        return CITIES.filter(function (row) { return tzOffset(now, row.zone) === offset; }).sort(byPopular).slice(0, 8);
      }
      const scored = [];
      CITIES.forEach(function (row) {
        const name = foldQuery(row.city);
        const region = foldQuery(row.region);
        const zone = row.zone.toLowerCase().replaceAll("_", " ");
        const aliases = (row.aliases || []).map(foldQuery);
        let score = 0;
        if (name === q) score = 100;
        else if (name.startsWith(q)) score = 80;
        else if (aliases.indexOf(q) !== -1) score = 75;
        else if (aliases.some(function (alias) { return alias.startsWith(q); })) score = 60;
        else if (name.includes(q) || aliases.some(function (alias) { return alias.includes(q); })) score = 50;
        else if (region.startsWith(q)) score = 40;
        else if (zone.includes(q)) score = 30;
        if (score) scored.push({ score: score, row: row });
      });

    function placeQueryParts(raw) {

    function placeFromGeo(row) {
      if (!row || !row.name || !row.timezone || !safeZone(row.timezone)) return null;
      if (typeof row.latitude !== "number" || typeof row.longitude !== "number") return null;
      const region = [];
      if (row.admin1 && foldQuery(row.admin1) !== foldQuery(row.name)) region.push(row.admin1);
      if (row.country) region.push(row.country);
      return {
        city: row.name,
        region: region.join(", ") || row.country || zoneLabel(row.timezone),
        zone: row.timezone,
        lat: row.latitude,
        lon: row.longitude

    function rankPlaces(rows, hints) {
      const populated = rows.filter(function (row) { return String(row.feature_code || "").indexOf("PPL") === 0; });
      const pool = populated.length ? populated : rows;
      return pool.map(function (row) {
        const place = placeFromGeo(row);
        if (!place) return null;
        const blob = foldQuery([row.name, row.admin1, row.admin2, row.country, row.country_code].filter(Boolean).join(" "));
        let score = Math.min(row.population || 0, 2000000) / 100000;
        hints.forEach(function (hint) { score += blob.includes(hint) ? 40 : -25; });

    function addCity(city) {
      const key = keyOf(city);
      const place = { city: city.city, region: city.region, zone: city.zone };
      if (typeof city.lat === "number" && typeof city.lon === "number") {
        place.lat = city.lat;
        place.lon = city.lon;

      if (state.replaceKey) {
        const index = state.cities.findIndex(function (item) { return keyOf(item) === state.replaceKey; });

        const instant = currentInstant();
        const wasAnchor = state.anchorKey === state.replaceKey;
        state.cities[index] = place;
        if (wasAnchor) {
          state.anchorKey = key;
          const parts = partsInZone(instant, place.zone);
          state.year = parts.year;
          state.month = parts.month;
          state.day = parts.day;
          state.minutes = parts.hour * 60 + parts.minute;
        }
        closeComposer();
        renderAll();
        return;
      }
      if (state.cities.some(function (item) { return keyOf(item) === key; })) {
        searchInput.value = "";
        closeList();
        renderChips();
        return;
      }
      if (state.cities.length >= 8) return;
      state.customOrder = true;
      state.cities.push(place);
      closeComposer();
      renderAll();
    }

    let toastTimer = 0;
    let undoStep = null;

    function showToast(text, undo) {
      const toast = document.getElementById("toast");
      document.getElementById("toast-text").textContent = text;
      undoStep = undo;
      toast.classList.add("in");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, 6000);
    }

    function hideToast() {
      document.getElementById("toast").classList.remove("in");
      undoStep = null;
    }

    function removeCity(key) {
      if (state.cities.length === 1) return;
      const removed = state.cities.find(function (city) { return keyOf(city) === key; });
      const before = {
        cities: state.cities.slice(),
        anchorKey: state.anchorKey,
        followDevice: state.followDevice,
        customOrder: state.customOrder,
        year: state.year,
        month: state.month,
        day: state.day,
        minutes: state.minutes
      };
      if (removed) {
        showToast(removed.city + " removed", function () {
          Object.assign(state, before, { cities: before.cities.slice() });
          renderAll();
        });
      }
      state.customOrder = true;
      const instant = currentInstant();
      state.cities = state.cities.filter(function (city) { return keyOf(city) !== key; });
      if (!state.cities.some(function (city) { return keyOf(city) === state.anchorKey; })) {
        state.anchorKey = keyOf(state.cities[0]);
        const parts = partsInZone(instant, anchorCity().zone);
        state.year = parts.year;
        state.month = parts.month;
        state.day = parts.day;
        state.minutes = parts.hour * 60 + parts.minute;
      }
      renderAll();
    }

    function setAnchor(key, follow) {
      state.followDevice = follow === true;
      if (state.anchorKey === key) {
        commit();
        return;
      }
      const instant = currentInstant();
      state.anchorKey = key;
      const parts = partsInZone(instant, anchorCity().zone);
      state.year = parts.year;
      state.month = parts.month;
      state.day = parts.day;
      state.minutes = parts.hour * 60 + parts.minute;
      renderAll();
      announce();
    }

    function shiftDay(delta) {
      const utc = Date.UTC(state.year, state.month - 1, state.day + delta);
      const date = new Date(utc);
      state.year = date.getUTCFullYear();
      state.month = date.getUTCMonth() + 1;
      state.day = date.getUTCDate();
      renderAll();
    }

    function minutesFromEvent(event) {
      const rect = laneEl.getBoundingClientRect();
      const ratio = Math.min(1, Math.max(0, (event.clientX - rect.left) / rect.width));
      return Math.min(1435, Math.max(0, Math.round((ratio * 1440) / 5) * 5));
    }

    function fillWorkSelects() {
      const start = document.getElementById("work-start");
      const end = document.getElementById("work-end");
      for (let hour = 0; hour < 24; hour += 1) {
        const option = document.createElement("option");
        option.value = String(hour);
        option.textContent = formatTime(hour, 0).text;
        start.append(option);
      }
      for (let hour = 1; hour <= 24; hour += 1) {
        const option = document.createElement("option");
        option.value = String(hour);
        option.textContent = formatTime(hour % 24, 0).text;
        end.append(option);
      }
    }

    fillWorkSelects();
    renderTicks();

    function noteVisit(area) {
      try {
        if (navigator.webdriver) return;
        var key = "fwd-audience";
        var now = new Date();
        var day = now.getFullYear() + "-"
          + String(now.getMonth() + 1).padStart(2, "0") + "-"
          + String(now.getDate()).padStart(2, "0");
        var store = {};
        try { store = JSON.parse(localStorage.getItem(key) || "{}") || {}; } catch (err) { store = {}; }
        if (!store.id || !/^[A-Za-z0-9_-]{8,64}$/.test(store.id)) {
          store.id = Math.random().toString(36).slice(2, 10) + Math.random().toString(36).slice(2, 10);
        }
        if (store[area] === day) return;
        var url = "https://api.forwardslashdot.com/api/hit?area=" + encodeURIComponent(area)
          + "&actor=human&visitor=" + encodeURIComponent(store.id)
          + "&day=" + day;
        fetch(url, { mode: "cors", credentials: "omit", cache: "no-store" }).then(function (res) {
          if (!res.ok) return;
          store[area] = day;
          localStorage.setItem(key, JSON.stringify(store));
        }).catch(function () {});
        var pending = { id: store.id };
        Object.keys(store).forEach(function (name) {
          if (name !== "id" && name !== area) pending[name] = store[name];
        });
        localStorage.setItem(key, JSON.stringify(pending));
      } catch (err) {}
    }
    noteVisit("world_time_converter");
    Promise.all([
      fetch("/cities.json").then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; }),
      fetch("/timezone-defaults.json").then(function (res) { return res.ok ? res.json() : null; }).catch(function () { return null; })
    ]).then(function (pair) {
      if (Array.isArray(pair[0]) && pair[0].length) CITIES = pair[0];
      if (pair[1] && typeof pair[1] === "object") ZONE_SETS = pair[1];
      restore();
      renderAll();
    });
    window.addEventListener("resize", fitSummary);

    document.getElementById("prev-day").addEventListener("click", function () { shiftDay(-1); });
    document.getElementById("next-day").addEventListener("click", function () { shiftDay(1); });
    document.getElementById("now").addEventListener("click", function () {
      const now = partsInZone(Date.now(), anchorCity().zone);
      state.year = now.year;
      state.month = now.month;
      state.day = now.day;
      state.minutes = now.hour * 60 + now.minute;
      renderAll();
      announce();
    });
    document.getElementById("date-input").addEventListener("change", function (event) {
      const bits = event.target.value.split("-").map(Number);
      if (bits.length !== 3 || !bits[0]) return;
      state.year = bits[0];
      state.month = bits[1];
      state.day = bits[2];
      renderAll();
    });

    document.querySelectorAll(".dur").forEach(function (button) {
      button.addEventListener("click", function () {
        state.duration = Number(button.dataset.dur);
        renderAll();
      });
    });

    function onWorkChange() {
      const start = Number(document.getElementById("work-start").value) * 60;
      const end = Number(document.getElementById("work-end").value) * 60;
      const note = document.getElementById("work-note");
      if (end <= start) {
        note.textContent = "The workday has to end after it starts.";
        syncChrome();
        return;
      }
      note.textContent = "";
      state.workStart = start;
      state.workEnd = end;
      renderAll();
    }
    document.getElementById("work-start").addEventListener("change", onWorkChange);
    document.getElementById("work-end").addEventListener("change", onWorkChange);

    rowsEl.addEventListener("pointerdown", function (event) {
      if (document.body.classList.contains("embed")) return;
      if (event.button) return;
      const card = event.target.closest(".dial-card");
      if (!card || event.target.closest(".row-confirm, .row-more, .band-hit")) return;
      reorder = {
        card: card,
        pointerId: event.pointerId,
        originX: event.clientX,
        originY: event.clientY,
        moved: false,
        armed: event.pointerType === "mouse",
        pointerType: event.pointerType,
        timer: 0
      };
      if (!reorder.armed) {
        reorder.timer = setTimeout(function () {
          if (!reorder || reorder.pointerId !== event.pointerId) return;
          reorder.armed = true;
        }, 220);
      }
    });
    window.addEventListener("pointermove", onReorderMove);
    window.addEventListener("pointerup", onReorderEnd);
    window.addEventListener("pointercancel", onReorderEnd);

    rowsEl.addEventListener("click", function (event) {
      if (suppressClick) {
        suppressClick = false;
        event.preventDefault();
        event.stopPropagation();
        return;
      }
      const swiped = event.target.closest(".dial-card.is-swiped");
      if (swiped && !event.target.closest(".row-confirm")) {
        closeCardMenus();
        return;
      }
      const more = event.target.closest(".row-more");
      if (more) {
        event.preventDefault();
        event.stopPropagation();
        const card = more.closest(".dial-card");
        if (menuKey === card.dataset.key) closeRowMenu();
        else {
          const box = more.getBoundingClientRect();
          openRowMenu(card, box.right, box.bottom + 6, true);
        }
        return;
      }
      if (event.target.closest("[data-action], [data-add]")) {
        event.stopPropagation();
        closeHome();
      }
      const action = event.target.closest("[data-action]");
      if (action) {
        const key = action.closest("[data-key]").dataset.key;
        closeCardMenus();
        if (action.dataset.action === "change") openComposer(key);
        else if (action.dataset.action === "remove") removeCity(key);
        return;
      }
      if (event.target.closest("[data-add]")) {
        const adder = document.getElementById("adder");
        if (adder.classList.contains("is-open") && !state.replaceKey) closeComposer();
        else openComposer("");
        return;
      }
      const name = event.target.closest("[data-anchor]");
      if (name) {
        closeCardMenus();
        setAnchor(name.dataset.anchor);
      }
    });

    // Scrubbing works from the axis and from any bar. A mouse jumps straight to the
    // pointer. A finger waits for a sideways move, so scrolling the page never moves the time.
    let scrubbing = null;

    function beginScrub(event, target) {
      if (event.button || document.body.classList.contains("embed")) return;
      const selection = window.getSelection();
      if (selection) selection.removeAllRanges();
      scrubbing = { id: event.pointerId, x: event.clientX, y: event.clientY, live: event.pointerType !== "touch", target: target };
      try { target.setPointerCapture(event.pointerId); } catch (err) { /* synthetic pointers */ }
      if (scrubbing.live) {
        document.body.classList.add("is-scrubbing");
        state.minutes = minutesFromEvent(event);
        paint();
      }
    }

    function moveScrub(event) {
      if (!scrubbing || event.pointerId !== scrubbing.id) return;
      if (!scrubbing.live) {
        if (Math.abs(event.clientX - scrubbing.x) < 6 || Math.abs(event.clientX - scrubbing.x) < Math.abs(event.clientY - scrubbing.y)) return;
        scrubbing.live = true;
        document.body.classList.add("is-scrubbing");
      }
      state.minutes = minutesFromEvent(event);
      paint();
    }

    function endScrub(event) {
      if (!scrubbing || event.pointerId !== scrubbing.id) return;
      const tap = !scrubbing.live && event.type === "pointerup";
      if (tap) state.minutes = minutesFromEvent(event);
      const changed = scrubbing.live || tap;
      scrubbing = null;
      document.body.classList.remove("is-scrubbing");
      if (!changed) return;
      paint();
      commit();
      announce();
    }

    slider.addEventListener("pointerdown", function (event) {
      event.preventDefault();
      beginScrub(event, slider);
    });
    rowsEl.addEventListener("pointerdown", function (event) {
      const hit = event.target.closest(".band-hit");
      if (hit) beginScrub(event, hit);
    });
    [slider, rowsEl].forEach(function (el) {
      el.addEventListener("pointermove", moveScrub);
      el.addEventListener("pointerup", endScrub);
      el.addEventListener("pointercancel", endScrub);
    });
    slider.addEventListener("selectstart", function (event) { event.preventDefault(); });

    slider.addEventListener("keydown", function (event) {
      const step = event.shiftKey ? 60 : 15;
      if (event.key === "ArrowRight" || event.key === "ArrowUp") state.minutes = Math.min(1439, state.minutes + step);
      else if (event.key === "ArrowLeft" || event.key === "ArrowDown") state.minutes = Math.max(0, state.minutes - step);
      else if (event.key === "Home") state.minutes = 0;
      else if (event.key === "End") state.minutes = 23 * 60 + 45;
      else return;
      event.preventDefault();
      paint();
      commit();
      announce();
    });

    document.addEventListener("keydown", function (event) {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "SELECT" || tag === "TEXTAREA") return;
      if (document.activeElement === slider) return;
      const step = event.shiftKey ? 60 : 15;
      if (event.key === "ArrowRight") state.minutes = Math.min(1439, state.minutes + step);
      else if (event.key === "ArrowLeft") state.minutes = Math.max(0, state.minutes - step);
      else return;
      event.preventDefault();
      paint();
      commit();
      announce();
    });

    document.getElementById("toast-undo").addEventListener("click", function () {
      const step = undoStep;
      hideToast();
      if (step) step();
    });

    document.getElementById("add-city").addEventListener("click", function (event) {
      event.stopPropagation();
      closeHome();
      closeCardMenus();
      closeRowMenu();
      const adder = document.getElementById("adder");
      if (adder.classList.contains("is-open") && !state.replaceKey) closeComposer();
      else openComposer("");
    });

    // A held finger must be able to drag a row without the page scrolling under it.
    window.addEventListener("touchmove", function (event) {
      if (reorder && reorder.armed && reorder.gesture !== "swipe" && event.cancelable) event.preventDefault();
    }, { passive: false });

    searchInput.addEventListener("input", function () {
      const query = searchInput.value.trim();
      renderChips();
      if (!query) {
        clearTimeout(placeTimer);
        placeQuery += 1;
        closeList();
        return;
      }
      const found = search(query);
      if (!found.length && query.includes("/") && safeZone(query)) {
        openResults([{ city: zoneLabel(query), region: "IANA time zone", zone: query }]);
        return;
      }
      openResults(found, found.length ? "" : "Looking…");
      clearTimeout(placeTimer);
      placeTimer = setTimeout(function () { searchPlaces(query); }, 280);
    });
    searchInput.addEventListener("keydown", function (event) {
      if (event.key === "ArrowDown") {
        event.preventDefault();
        if (cityList.hidden) searchInput.dispatchEvent(new Event("input"));
        else moveOption(1);
      } else if (event.key === "ArrowUp") {
        event.preventDefault();
        moveOption(-1);
      } else if (event.key === "Escape") {
        closeList();
      } else if (event.key === "Enter") {
        event.preventDefault();
        const options = cityList.querySelectorAll(".option");
        if (options[activeOption]) options[activeOption].click();
      }
    });
    searchInput.addEventListener("blur", function () {
      setTimeout(closeList, 140);
    });

    function closeHome() {
      const menu = document.getElementById("home-menu");
      menu.hidden = true;
      document.getElementById("where").setAttribute("aria-expanded", "false");
    }

    function useMyLocation() {
      const place = placeForZone(state.detected);
      if (!place) return;
      if (!state.cities.some(function (city) { return city.zone === place.zone; })) {
        if (state.cities.length >= 8) state.cities.pop();
        state.cities.unshift(place);
      }
      const match = state.cities.find(function (city) { return city.zone === place.zone; });
      closeHome();
      setAnchor(keyOf(match), true);
      renderAll();
    }

    function openHome() {
      const menu = document.getElementById("home-menu");
      const button = document.getElementById("where");
      menu.replaceChildren();
      const detected = placeForZone(state.detected);
      const items = [];
      if (detected) items.push({ place: detected, follow: true, label: "Your location", hint: detected.city });
      state.cities.forEach(function (city) {
        if (detected && city.zone === detected.zone && city.city === detected.city) return;
        items.push({ place: city, follow: false, label: city.city, hint: "Show the day in this city" });
      });
      items.forEach(function (item, index) {
        const li = document.createElement("li");
        li.setAttribute("role", "presentation");
        const choice = document.createElement("button");
        choice.type = "button";
        choice.setAttribute("role", "option");
        const selected = item.follow ? state.followDevice : keyOf(item.place) === state.anchorKey && !state.followDevice;
        choice.setAttribute("aria-selected", selected ? "true" : "false");
        choice.id = "home-opt-" + index;
        const name = document.createElement("span");
        name.textContent = item.label;
        const hint = document.createElement("span");
        hint.className = "hint";
        hint.textContent = item.hint;
        choice.append(name, hint);
        choice.addEventListener("click", function () {
          closeHome();
          if (item.follow) useMyLocation();
          else setAnchor(keyOf(item.place), false);
        });
        li.append(choice);
        menu.append(li);
      });
      menu.hidden = false;
      button.setAttribute("aria-expanded", "true");
    }

    document.getElementById("where").addEventListener("click", function () {
      const menu = document.getElementById("home-menu");
      if (menu.hidden) openHome();
      else closeHome();
    });
    rowsEl.addEventListener("contextmenu", function (event) {
      if (!window.matchMedia("(hover: hover) and (pointer: fine)").matches) return;
      const card = event.target.closest(".dial-card");
      if (!card) return;
      event.preventDefault();
      openRowMenu(card, event.clientX, event.clientY, false);
    });
    rowsEl.addEventListener("scroll", closeRowMenu);
    document.getElementById("row-menu").addEventListener("click", function (event) {
      const item = event.target.closest("[data-menu]");
      if (!item || item.disabled || !menuKey) return;
      event.stopPropagation();
      const key = menuKey;
      closeRowMenu();
      if (item.dataset.menu === "change") openComposer(key);
      else if (item.dataset.menu === "remove") removeCity(key);
    });
    document.addEventListener("click", function (event) {
      if (!event.target.closest(".where-wrap")) closeHome();
      if (!event.target.closest(".row-confirm")) closeCardMenus();
      if (!event.target.closest("#adder, #add-city, [data-add], #row-menu")) closeComposer();
      if (!event.target.closest("#row-menu, .row-more")) closeRowMenu();
    });
    document.addEventListener("keydown", function (event) {
      if (event.key === "Escape") {
        closeHome();
        closeCardMenus();
        closeRowMenu();
        closeComposer();
      }
    });

    document.getElementById("best").addEventListener("click", function () {
      const start = Number(this.dataset.start);
      if (!Number.isFinite(start)) return;
      state.minutes = start;
      paint();
      commit();
      announce();
    });

    const SHARE_GLYPH = '<path d="M12 3.5v11.5" /><path d="m7.5 8 4.5-4.5L16.5 8" /><path d="M5.5 12.5v6a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-6" />';
    const CHECK_GLYPH = '<path d="m5 12.5 4.5 4.5L19 7.5" />';

    function playBounce(el) {
      if (!el || window.matchMedia("(prefers-reduced-motion: reduce)").matches) return;
      el.classList.remove("mh-bounce");
      void el.offsetWidth;
      el.classList.add("mh-bounce");
      el.addEventListener("animationend", function () { el.classList.remove("mh-bounce"); }, { once: true });
    }

    document.getElementById("share").addEventListener("click", function () {
      const button = document.getElementById("share");
      const glyph = button.querySelector("svg");
      const label = button.querySelector(".share-label");
      syncUrl();
      const line = document.getElementById("chat-line").textContent;
      const url = location.href;
      const title = document.title;
      playBounce(glyph);
      const touch = window.matchMedia("(pointer: coarse)").matches;
      const payload = touch ? { text: line, url: url } : { title: title, text: line, url: url };
      const markCopied = function () {
        glyph.innerHTML = CHECK_GLYPH;
        label.textContent = "Copied";
        button.classList.add("is-copied");
        button.setAttribute("aria-label", "Link copied");
        setTimeout(function () {
          glyph.innerHTML = SHARE_GLYPH;
          label.textContent = "Share";
          button.classList.remove("is-copied");
          button.setAttribute("aria-label", "Share this comparison");
        }, 1600);
      };
      const copy = function () {
        const text = line + "\n" + url;
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(markCopied, function () {});
        }
      };
      if (typeof navigator.share === "function") {
        const data = typeof navigator.canShare === "function" && !navigator.canShare(payload) ? { url: url } : payload;
        if (typeof navigator.canShare !== "function" || navigator.canShare(data)) {
          navigator.share(data).then(function () {}, function (err) {
            if (err && err.name === "AbortError") return;
            copy();
          });
          return;
        }
      }
      copy();
    });

    window.addEventListener("resize", paint);
  </script>
</body>
</html>
